      return"Records the "+Math.pow(2,n).toLocaleString()+" IDs where (ID AND mask) = "+hx(base)+": "+hx(base)+" to "+hx((base|free)>>>0)+".";
    }
    const paintRet=(row,files,mb)=>{const v=retTxt(files,mb);const hp=row.querySelector(".help");hp.textContent=v.text;hp.style.color=v.warn?"var(--warning)":"";};
    syncAll=()=>{
      const on=!!vals.enabled,cl=on&&!!vals.can_log;
      cardPar.style.display=on?"":"none";cardCan.style.display=on?"":"none";
      nothing.style.display=(on&&vals.autopid_log==="off"&&!vals.can_log)?"":"none";
      modeSel.value=filterMode?"filter":"all";extSel.value=isExt()?"29":"11";
      mainRows.sync();parRows.sync();canRows.sync();
      matchHelp.textContent=matchDesc();
      canOff.style.display=(cl&&canBusOn()===false)?"":"none";
      paintRet(parRet,vals.max_files,vals.max_file_mb);paintRet(canRet,vals.can_max_files,vals.can_max_file_mb);
      paints.forEach(f=>f());
    };
    syncAll();
    formEl.replaceChildren(cardMain,cardPar,cardCan);
    /* the retention lines compare against the card size once it is known */
    sdRefresh().then(()=>{paintRet(parRet,vals.max_files,vals.max_file_mb);paintRet(canRet,vals.can_max_files,vals.can_max_file_mb);});
  }catch(e){formEl.replaceChildren(banner("crit","alert",e.message));}

  /* ---- status: one glance, then the figures per stream ---- */
  const modeName=()=>dev?({off:"Off (rules only)",changed:"When a value changes",all:"Every poll"}[dev.autopid_log]||dev.autopid_log):"—";
  const streamBlock=(t,i,rows)=>h("div",{class:"lg-stream"},h("h4",{},ic(i),t),kv(rows));
  const drop=n=>n?chip(fmt.num(n),"crit"):"0";
  async function status(){
    const l=await tryGet("/api/logger");if(!l)return;
    const can=l.can||{};const sd=isMounted();
    const state=!l.enabled?chip("Off",""):l.paused?chip("Paused","warn"):(l.running&&l.storage_ok)?chip("Recording","ok"):sd?chip("Waiting for storage","warn"):chip("No SD card","crit");
    const storage=sd?chip(sdInfo&&sdInfo.total?"SD card · "+fmt.bytes(sdInfo.used)+" of "+fmt.bytes(sdInfo.total)+" used":"SD card mounted","ok"):chip("No SD card","crit");
    const chips=h("div",{class:"lg-chips"},state,storage);
    if(l.errors)chips.append(chip(fmt.num(l.errors)+" write errors","crit"));
    if(l.salvaged)chips.append(chip(fmt.num(l.salvaged)+" records recovered after the last reset","info"));
    const gate=l.enabled?[h("button",{class:"btn sm",type:"button",
      title:l.paused?"Resume writing to the card":"Pause writing until you resume or the device restarts: settings stay as they are",
      onclick:async()=>{try{await api("/api/logger/gate",{method:"POST",body:{enabled:!!l.paused}});toast(l.paused?"Logging resumed":"Logging paused","ok");
        /* the writer closes / reopens its files within one ~200 ms loop; read the state after that */
        await new Promise(r=>setTimeout(r,700));await status();}catch(e){toast(e.message,"err");}}},
      ic(l.paused?"play":"pause"),l.paused?"Resume":"Pause")]:[];
    const body=[chips];
    /* a set-aside file (ROBUSTNESS.md case 5): say what happened and what to do */
    if(l.corrupt)body.push(banner("warn","alert",h("b",{},fmt.num(l.corrupt)+" log file"+(l.corrupt>1?"s were":" was")+" found corrupt"),
      " and set aside as *.corrupt in /sd/logs. Logging went on in a fresh file and what could still be read was salvaged. For a deeper recovery download the .corrupt file and run tools/db_recover.py on a PC, then delete it in the ",
      h("a",{href:"#/files/sd/logs"},"File Manager"),"."));
    if(!l.enabled)body.push(h("div",{class:"empty",style:"padding:12px 0 2px"},"Logging is off: turn it on below and choose what to record."));
    else body.push(h("div",{class:"cols2"},
      streamBlock("Vehicle parameters","gauge",[["Mode",modeName()],["File",l.file||"—"],["Rows written",fmt.num(l.written)],["Dropped",drop(l.dropped)],["Files on card",fmt.num(l.files)],["Rotations",fmt.num(l.rotations)]]),
      streamBlock("CAN frames","activity",can.enabled?[["Bus",canBusOn()===false?chip("CAN bus off","warn"):canBusOn()?chip("On","ok"):"—"],["File",can.file||"—"],["Frames written",fmt.num(can.frames_written)],["Dropped",drop(can.frames_dropped)],["Files on card",fmt.num(can.files)],["Rotations",fmt.num(can.rotations)]]
        :[["Recording",chip("Off","")]])));
    statusEl.replaceChildren(cardTools("Status","harddrive",[...gate,folderBtn()],...body));
    active=new Set([l.file,can.file].filter(Boolean));
    /* re-list when a file rotates or the set of open files changes (pause, resume, card events) */
    const sig=[...active].sort().join("|"),rot=(l.rotations||0)+(can.rotations||0);
    if(rot!==lastRot||sig!==lastSig){lastRot=rot;lastSig=sig;loadFiles();}
  }

  /* ---- the newest files; the active ones are write-locked until paused ---- */
  const filesWrap=h("div",{});
  async function loadFiles(){
    if(!isMounted()){filesWrap.replaceChildren(h("div",{class:"empty"},"No SD card: insert one to record logs."));return;}
    const r=await tryGet("/api/fs/list?path="+enc(LOG_DIR));
    if(!r){filesWrap.replaceChildren(h("div",{class:"empty"},"No log folder yet: it is created when the logger first runs."));return;}
    const ents=(r.entries||[]).filter(e=>!e.dir).map(e=>{const m=e.name.match(/^(dl|can)_(\d+)\.(\w+)$/);
      return{name:e.name,size:e.size,stream:m?(m[1]==="dl"?"Parameters":"CAN frames"):"—",epoch:m?Number(m[2]):0,ext:m?m[3]:(e.name.split(".").pop()||"")};})
      .sort((a,b)=>b.epoch-a.epoch||b.name.localeCompare(a.name));
    const MAXN=8,show=ents.slice(0,MAXN);
    const tbl=dataTable([
      {label:"File",get:e=>h("span",{class:"rowflex",style:"gap:8px"},h("span",{class:"mono"},e.name),active.has(e.name)?chip("recording","ok"):null)},
      {label:"Stream",get:e=>e.stream},
      {label:"Format",get:e=>LOG_EXT_NAME[e.ext]||e.ext.toUpperCase()},
      {label:"Started",get:e=>e.epoch>1e9?new Date(e.epoch*1000).toLocaleString():"—"},
      {label:"Size",align:"right",get:e=>fmt.bytes(e.size)},
      {label:"",get:e=>active.has(e.name)?h("span",{class:"help",title:"The file being written is locked: pause logging to download it"},"in use"):
        h("a",{class:"btn sm gh",title:"Download",href:API+"/api/fs/download?path="+enc(LOG_DIR+"/"+e.name),download:e.name},ic("download"))}],
      show,{empty:"No log files yet."});
    filesWrap.replaceChildren(tbl,ents.length>MAXN?h("div",{class:"help",style:"margin-top:8px"},"Newest "+MAXN+" of "+ents.length+" files: open the folder for the rest."):null);
  }
  filesEl.append(cardTools("Log files","folder",[h("button",{class:"btn sm gh",type:"button",title:"Refresh the list",onclick:()=>loadFiles()},ic("refresh")),folderBtn()],filesWrap));

  await sdRefresh();
  await status();
  if(lastRot<0)await loadFiles();
  const t=setInterval(()=>{if(conn.state!=="online")return;status();if(++tick%5===0)sdRefresh().then(loadFiles);},4000);
  return()=>clearInterval(t);
};

/* ---- Dashboard ---- */
/* Live values of the parameters Automate polls. Reworked 2026-09-06
   (meatpi): real state chips, group switches + poll stats, class icons,
   the parameter's own min/max as the gauge range, the PID / filter / GPS
   source and the value's age (stale values fade). Customisable since the
   same day: Customise puts a gear on every tile: widget (number, bar,
   dial, trend, chart), range, warnings, decimals, width, hide: and the
   tiles drag to reorder; the layout is ONE small file on the device
   (/data/dashboard.json through the fs API) so every browser sees the
   same dashboard. Charts use uPlot, which is NOT embedded in the
   firmware: the page fetches the pinned build from the CDN, checks size +
   FNV-1a, stores it on internal flash (or the SD card when flash is
   short) under cache/www through /api/fs/upload and loads it from
   /cache/www/ (/sdcache/www/), the catch-all prefixes web_ui_v2.c
   registers: anything under cache/ is re-creatable. Metadata (class, min/max,
   PID, group) comes from /api/autopid/config, re-read when the parameter
   set changes. Tiles are persistent DOM nodes updated in place (charts

const DASH_CLASS_ICON={temperature:"thermo",battery:"battery",battery_charging:"battery",voltage:"zap",current:"zap",power:"zap",energy:"zap",
  pressure:"gauge",atmospheric_pressure:"gauge",speed:"gauge",distance:"route",frequency:"activity",duration:"clock",plug:"plug",
  gas:"cloud",carbon_dioxide:"cloud",humidity:"droplet",volume_storage:"droplet",volume_flow_rate:"droplet",percentage:"pulse",power_factor:"pulse"};

const DASH_LAYOUT_PATH="/data/dashboard.json";
const UI_STORES=[{id:"data",label:"internal flash",dir:"/data/cache/www",uri:"/cache/www/",info:"/api/fs/info?path=/data"},
  {id:"sd",label:"SD card",dir:"/sd/cache/www",uri:"/sdcache/www/",info:"/api/fs/info?path=/sd"}];

   is unavailable over plain http), kept under <store>/cache/www —
   internal flash first, the SD card when flash is short: and loaded
   from /cache/www/ or /sdcache/www/. uPlot draws the chart tiles;
   sql.js (WebAssembly) reads SQLite parameter logs for the history. */
const UI_RES={
  uplot:{id:"uplot",title:"chart library",label:"uPlot 1.6.31 (52 KB, MIT)",sizeTxt:"52 KB",need:200000,global:"uPlot",
    script:"uPlot.iife.min.js",css:"uPlot.min.css",cdn:"https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/",
    files:[{name:"uPlot.iife.min.js",size:50312,fnv:0x9fc5ab1a},{name:"uPlot.min.css",size:1857,fnv:0x18c6fd8b}],state:window.uPlot?"ready":"unknown",store:null},
  sqljs:{id:"sqljs",title:"SQLite reader",label:"sql.js 1.14.2 (690 KB, MIT)",sizeTxt:"690 KB",need:1000000,global:"initSqlJs",
    script:"sql-wasm.js",css:null,cdn:"https://cdn.jsdelivr.net/npm/sql.js@1.14.2/dist/",
    files:[{name:"sql-wasm.js",size:46535,fnv:0xba169d2b},{name:"sql-wasm.wasm",size:658410,fnv:0x4c763960}],state:window.initSqlJs?"ready":"unknown",store:null}};
const SVG_NS="http://www.w3.org/2000/svg";
const encP=x=>encodeURIComponent(x).replace(/%2F/gi,"/");
function fnv1a(buf){const b=new Uint8Array(buf);let x=0x811c9dc5;for(let i=0;i<b.length;i++){x^=b[i];x=Math.imul(x,0x01000193)>>>0;}return x>>>0;}
async function fsPut(path,buf){
  try{return await api("/api/fs/upload?path="+encP(path),{method:"POST",body:buf,headers:{"Content-Type":"application/octet-stream"}});}
  catch(e){const fd=new FormData();fd.append("file",new Blob([buf]),path.split("/").pop());return api("/api/fs/upload?path="+encP(path),{method:"POST",body:fd});}
}
function loadScript(src){return new Promise(res=>{const sc=h("script",{src,onload:()=>res(true),onerror:()=>res(false)});setTimeout(()=>res(false),12000);document.head.append(sc);});}
async function ensureResource(res){
  if(window[res.global]){res.state="ready";return true;}
  if(res.state==="loading")return false;
  res.state="loading";
  const js=res.scripts||[res.script],css=res.css?[].concat(res.css):[];
  for(const st of UI_STORES){
    if(!await loadScript(st.uri+js[0]))continue;          /* the core decides which store holds the library */
    let ok=true;for(const f of js.slice(1))ok=ok&&await loadScript(st.uri+f);   /* add-ons after it, in order */
    if(!ok)break;
    res.store=st;
    css.forEach((c,i)=>{const id="css-"+res.id+(i||"");if(!$("#"+id))document.head.append(h("link",{id,rel:"stylesheet",href:st.uri+c}));});
    res.state="ready";return true;
  }
  res.state="missing";return false;
}
async function installResource(res){
  const opts=[];
  for(const st of UI_STORES){const fi=await tryGet(st.info);if(fi&&fi.total>0&&(fi.total-fi.used)>res.need)opts.push(st);}
  const blurb="The "+res.title+" ("+res.label+") is downloaded by this browser from cdn.jsdelivr.net and stored on the WiCAN, so it loads locally from then on.";
  if(!opts.length){
    await new Promise(r=>modal({title:"Install the "+res.title,body:h("div",{},banner("warn","alert","No room for the "+res.title+" ("+res.sizeTxt+"): internal flash is full and no SD card is mounted. Insert an SD card (or free space under Files → /data) and try again.")),actions:[{label:"OK",fn:r}]}));
    return false;}
  let store=opts[0];
  if(opts.length>1){
    store=await new Promise(done=>{const sel=h("select",{},...opts.map(o=>h("option",{value:o.id},o.label)));
      modal({title:"Install the "+res.title,body:h("div",{},h("p",{},blurb),h("div",{class:"frow"},h("label",{},"Store on"),h("div",{class:"ctl"},sel))),
        actions:[{label:"Cancel",fn:()=>done(null)},{label:"Install",kind:"pri",fn:()=>done(opts.find(o=>o.id===sel.value))}]});});
    if(!store)return false;}
  else if(!await confirmModal(blurb+" It goes on the "+store.label+".","Install the "+res.title))return false;
  toast("Downloading the "+res.title+"…");
  try{
    for(const f of res.files){
      const r=await fetch(res.cdn+(f.path||f.name),{cache:"no-store"});if(!r.ok)throw new Error("download failed ("+r.status+")");
      const buf=await r.arrayBuffer();
      if(buf.byteLength!==f.size||fnv1a(buf)!==f.fnv)throw new Error(f.name+" does not match the pinned build");
      await fsPut(store.dir+"/"+f.name,buf);
    }
  }catch(e){toast("Install failed: "+e.message,"err");return false;}
  res.state="unknown";
  const ok=await ensureResource(res);
  toast(ok?"The "+res.title+" is installed on the "+store.label:"Stored, but the "+res.title+" did not load",ok?"ok":"err");
  return ok;
}
/* Samples per parameter, kept across page visits: {t: device ts_us (live) | null (logger), w: wall-clock s, v}. */
const DASH_HIST=new Map(),DASH_HIST_CAP=25000;
const DASH_WINDOWS={900:"15 min",3600:"1 hour",10800:"3 hours",21600:"6 hours"};
/* History from the logger (2026-09-06): every parameter format the
   data_logger writes. JSON lines and CSV stream through
   /api/logger/export (?name=<param>, cursor "<file-epoch>:<offset>");
   binary (.wdl) and SQLite (.db) files are fetched whole through
   /api/fs/download and decoded here: the .wdl reader below mirrors
   tools/wdl_dump.py, SQLite needs the sql.js reader (installed on demand
   like the chart library). The file being written is locked: the
   logger's gate is paused for the download and resumed after. Record
   times are shifted by the browser-vs-/api/rtc offset so an unset
   device clock still lines up with the live samples. Decoded files are

/* ---- Terminal ---- */
PAGES.terminal=async(view)=>{
  const p=page(view,null,"Terminal","Interactive command line: the WiCAN console or an ELM327 terminal on the OBD interface.");
  const typeSel=h("select",{style:"width:230px"},
    h("option",{value:"console"},"WiCAN Command Line"),
    h("option",{value:"elm327"},"ELM327"));
  const connBtn=h("button",{class:"btn pri"},"Connect");
  const badge=chip("Disconnected","crit");
  const title=h("span",{class:"tt"},"wican-console: /ws/cli");
  const out=h("pre",{class:"term-body"},"");
  const cursor=h("span",{style:"animation:blink 1.1s step-start infinite"},"▋");
  const prompt=h("span",{class:"pr"},"wican>");
  const input=h("input",{placeholder:"Connect to start",disabled:true,autocomplete:"off",spellcheck:"false"});
  const sendBtn=h("button",{class:"btn sm",disabled:true},"Send");
  const readyEl=h("div",{});
  p.append(
    h("div",{class:"rowflex",style:"flex-wrap:wrap;gap:11px"},
      h("span",{style:"font-size:13px;font-weight:600;color:var(--text-2)"},"Terminal type"),
      typeSel,connBtn,h("span",{class:"grow"}),badge),
    readyEl,
    h("div",{class:"term"},
      h("div",{class:"term-head"},h("span",{class:"td1"}),h("span",{class:"td2"}),h("span",{class:"td3"}),title),
      out,
      h("div",{class:"term-in"},prompt,input,sendBtn)));
  out.append(cursor);
  let ws=null,hist=[],hi=0;
  const dec=new TextDecoder();
  const put=t=>{cursor.remove();out.append(t);out.append(cursor);out.scrollTop=out.scrollHeight;};
  /* ---- readiness: the terminal only works when a WebSocket channel is
     bridged to the console (cli ⇄ /ws/cli) or the OBD chip (obd ⇄ /ws/obd).
     A fresh device ships with ws_cli DISABLED and no cli bridge, so
     "Connect" used to fail silently for every new user (meatpi 2026-09-05).
     Detect it, say so, and offer a one-click staged fix. ---- */
  const TERM={console:{iface:"cli",path:"/ws/cli",bridge:"br_cli",mode:"text",label:"WiCAN console",row:"Console (CLI) ⇄ WebSocket"},
              elm327:{iface:"obd",path:"/ws/obd",bridge:"br_obd",mode:"binary",label:"ELM327 terminal",row:"OBD chip ⇄ WebSocket"}};
  let wm=null,bm=null,stagedHere=false;
  const strip=o=>{const c={...o};delete c.degraded;delete c.pending_reboot;return c;};
  async function loadBridges(){
    const[w,b]=await Promise.all(["websocket_manager","bridge_manager"].map(c=>tryGet("/api/settings/"+c)));
    wm=w?strip(w):null;bm=b?strip(b):null;
  }
  function bridgeState(t){
    if(!wm||!bm)return null; /* unknown → don't block the user */
    const ch=(wm.channels||[]).find(c=>c.path===t.path);
    const br=ch&&(bm.bridges||[]).find(x=>(x.a===t.iface&&x.b===ch.name)||(x.b===t.iface&&x.a===ch.name));
    return{ch,br,ready:!!(ch&&ch.enabled!==false&&br&&br.enabled!==false)};
  }
  function stageBridge(t){
    const w={channels:(wm.channels||[]).map(c=>({...c}))},b={bridges:(bm.bridges||[]).map(x=>({...x}))};
    let ch=w.channels.find(c=>c.path===t.path);
    if(!ch){
      if(w.channels.length>=6)return toast("No free WebSocket channel: remove one under All Settings → WebSocket channels","err");
      ch={name:"ws_"+t.iface,path:t.path,mode:t.mode,enabled:true};w.channels.push(ch);
    }else ch.enabled=true;
    let br=b.bridges.find(x=>(x.a===t.iface&&x.b===ch.name)||(x.b===t.iface&&x.a===ch.name));
    let parked=null;
    if(!br){
      /* single-consumer rule: an interface carries ONE enabled bridge */
      const other=b.bridges.find(x=>x.enabled!==false&&(x.a===t.iface||x.b===t.iface));
      if(other){other.enabled=false;parked=other.name;}
      if(b.bridges.length>=6)return toast("No free connection slot: remove one under Settings → Connections","err");
      b.bridges.push({name:t.bridge,a:t.iface,b:ch.name,translator:"raw",enabled:true});
    }else br.enabled=true;

    wm=w;bm=b;stagedHere=true;paintReady();

  }
  function paintReady(){
    const t=TERM[typeSel.value];const st=bridgeState(t);
    readyEl.replaceChildren();
    if(!st||ws){connBtn.disabled=false;return;}
    if(stagedHere||(st.ready&&!ws&&connBtn.dataset.refused===t.path)){
      connBtn.disabled=true;
      readyEl.append(banner("info","alert",h("b",{},t.label+" is configured but not active yet. "),
        "Press ",h("b",{},"Submit Changes")," in the header (or ",h("b",{},"reboot to apply")," in the side menu if it says Restart pending). The device restarts; then come back and Connect."));
      return;
    }
    if(st.ready){connBtn.disabled=false;return;}
    connBtn.disabled=true;
    readyEl.append(banner("warn","alert",h("b",{},"The "+t.label+" is not wired to the web terminal. "),
      "It needs a ",h("b",{},t.row)," connection on ",h("code",{},t.path),". ",
      h("button",{class:"btn sm pri",style:"margin:0 8px",onclick:()=>stageBridge(t)},"Enable "+t.label),
      h("span",{class:"help"},"or set it up under Settings → Connections; it applies with Submit (device restarts).")));
  }
  await loadBridges();
  typeSel.onchange=()=>{title.textContent=(typeSel.value==="elm327"?"elm327: ":"wican-console: ")+TERM[typeSel.value].path;paintReady();};
  paintReady();
  function setConnState(on){
    badge.className="chip "+(on?"ok":"crit");badge.replaceChildren(h("span",{class:"d"}),on?"Connected":"Disconnected");
    connBtn.className="btn "+(on?"danger":"pri");connBtn.textContent=on?"Disconnect":"Connect";
    typeSel.disabled=on;input.disabled=!on;sendBtn.disabled=!on;
    input.placeholder=on?(typeSel.value==="elm327"?"e.g. ATZ, 0100, 010C":"e.g. help, status, version"):"Connect to start";
    if(on)setTimeout(()=>input.focus(),40);
  }
  function connect(){
    const elm=typeSel.value==="elm327";
    const path=elm?"/ws/obd":"/ws/cli";
    title.textContent=(elm?"elm327: ":"wican-console: ")+path;
    prompt.textContent=elm?">":"wican>";
    const url=(API?API.replace(/^http/,"ws"):location.origin.replace(/^http/,"ws"))+path;
    try{ws=new WebSocket(url);}catch{put("cannot open "+url+"\n");return;}
    ws.binaryType="arraybuffer";
    let opened=false;
    ws.onopen=()=>{opened=true;delete connBtn.dataset.refused;setConnState(true);put("[connected "+path+"]\n");};
    ws.onclose=()=>{if(ws){
      if(opened)put("\n[disconnected]\n");
      else{ /* refused = no bridge on this path (or a staged one not applied yet) */
        put("\n[could not connect to "+path+": "+(elm?"no OBD chip ⇄ WebSocket connection on /ws/obd":"the console is not bridged to /ws/cli")+". Set it up under Settings → Connections (or use the button above) and Submit; a change that is still pending needs the restart first.]\n");
        connBtn.dataset.refused=path;loadBridges().then(paintReady);}
      setConnState(false);ws=null;}};
    ws.onmessage=e=>put((typeof e.data==="string"?e.data:dec.decode(e.data)).replace(/\r/g,"\n").replace(/\n+/g,"\n"));
  }
  connBtn.onclick=()=>{if(ws){const w=ws;ws=null;w.close();setConnState(false);}else connect();};
  function send(){
    if(!ws||ws.readyState!==1)return;
    const v=input.value;if(!v.trim())return;
    put((typeSel.value==="elm327"?"":"wican> ")+v+"\n");
    /* NEWLINE REQUIRED: a bare send poisons the console's line buffer */
    ws.send(v+(typeSel.value==="elm327"?"\r":"\r\n"));
    hist.push(v);hi=hist.length;input.value="";
  }
  sendBtn.onclick=send;
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();send();}
    else if(e.key==="ArrowUp"){if(hi>0){hi--;input.value=hist[hi]||"";e.preventDefault();}}
    else if(e.key==="ArrowDown"){if(hi<hist.length){hi++;input.value=hist[hi]||"";}}});
  return()=>{if(ws){const w=ws;ws=null;w.close();}};
};

/* ---- USB + ESPNetLink (ported from the legacy usbhost tab, on the v6 API) ---- */
PAGES.usb=async(view,sub)=>{
  const badge=chip("…","");
  const p=page(view,null,"USB & ESPNetLink","Connector role, the ESPNetLink LTE/GPS dongle (WiFi-modem or USB-Ethernet uplink) and USB-Ethernet adapters.",[badge]);
  const wrap=h("div",{class:"pane"});p.append(wrap);
  const paneStatus=h("div",{class:"pane"}),paneSettings=h("div",{class:"pane"}),paneConsole=h("div",{class:"pane"});
  const stEl=h("div",{});
  const consEl=h("div",{});const consOff=h("div",{class:"empty"},"No dongle console bound: the console needs USB data on (USB-Ethernet mode, or before the cut) and the console enabled below.");
  const nlEl=h("div",{});const nlOff=h("div",{class:"empty"},"Live LTE / GPS status appears once the dongle is reachable (over its WiFi AP or the USB link).");
  const DRV={asix:"ASIX",rtl8152:"RTL8152",cdc_ecm:"CDC-ECM",cdc_ncm:"CDC-NCM",rndis:"RNDIS","ncm-dev":"CDC-NCM (device)"};
  const UPL={none:["No uplink",""],wifi:["Wi-Fi (other network)","ok"],espnetlink:["ESPNetLink (WiFi modem)","ok"],espnetlink_usb:["ESPNetLink (USB Ethernet)","ok"]};
  const PST={idle:["No USB link (dongle cut or absent, normal when paired)",""],identify:["Identifying…","warn"],read_key:["Reading AP key…","warn"],cut:["Cutting USB data…","warn"],wait_drop:["Waiting for USB drop…","warn"],
    done:["Paired: cable is power only","ok"],tether:["Dongle locked to USB (usb_mode=ncm)","warn"],foreign:["Not an ESPNetLink / gave up","warn"],ncm_share:["Configuring the dongle (USB class / LTE sharing)…","warn"],ncm_up:["USB-Ethernet uplink up","ok"],
    hold:["Pairing on hold (see the note below)","warn"],unsupported:["Dongle firmware unsupported: update the dongle","warn"]};
  let acmOn=false,nl=null,haveNl=false,lastUsb=null;
  async function status(){
    const[u,acm,e]=await Promise.all([tryGet("/api/usb"),tryGet("/api/usb/acm"),tryGet("/api/espnetlink")]);
    if(!u)return;
    nl=e;haveNl=!!e;lastUsb=u;
    const onNl=!!(e&&e.on_link);
    badge.className="chip "+(onNl||u.eth_connected?"ok":u.device_present?"warn":"");
    badge.replaceChildren(h("span",{class:"d"}),
      onNl?(e.uplink==="espnetlink"?"Dongle via WiFi":"Dongle via USB"):u.eth_connected?"Uplink up":u.host_active?(u.device_present?"Device attached":"Host idle"):"Device mode");
    stEl.replaceChildren(kv([
      ["Connector role",u.host_active?"ESP host (OTG)":"Serial / device"],
      ["Device present",u.device_present?"yes":"no"],
      ["USB device",u.vid&&u.vid!=="0000"?(u.vid+":"+u.pid+(u.vid==="303a"&&u.pid==="4007"?" (ESPNetLink)":"")):"—"],
      ["Ethernet uplink",u.eth_connected?"connected":"—"],
      ["Driver",u.eth_connected?(DRV[u.driver]||u.driver||"—"):"—"],
      ["IP",u.ip||"—"],
      ["VBUS",u.host_active?(u.vbus?"on":"off"):"—"],
      ["Enumerations",u.attaches],
      ["Dongle console",acm?(acm.connected?"connected":"not bound"):"—"]]));
    const on=!!(acm&&acm.connected);
    acmOn=on;
    consEl.style.display=on?"":"none";consOff.style.display=on?"none":"";
    const showNl=onNl||on;
    nlEl.style.display=showNl?"":"none";nlOff.style.display=showNl?"none":"";
    renderNl();
  }

  /* ---- ESPNetLink: pairing + uplink state (espnetlink_link) ---- */
  const nlKv=h("div",{});
  function renderNl(){
    if(!haveNl){nlKv.replaceChildren(h("div",{class:"help"},"ESPNetLink support is not in this build."));return;}
    const e=nl,pst=(e.usb||{}).pair_state||"",up=UPL[e.uplink]||[e.uplink,""],u=lastUsb||{};
    const usbMode=e.mode==="usb_ncm"||e.mode==="usb_rndis";
    const modeLabel=e.mode==="usb_ncm"?"USB Ethernet (NCM)":e.mode==="usb_rndis"?"USB Ethernet (RNDIS)":"WiFi modem (USB = power only)";
    /* idle in a USB mode is simply "no link yet", not a cut */
    const ps=(pst==="idle"&&usbMode)?["Waiting for the USB-Ethernet link",""]:(PST[pst]||[pst||"—",""]);
    const d=e.dongle||{},g=e.gps||{};
    /* the dongle firmware level (bench 2026-09-08: a stale dongle build
       looked like "Not an ESPNetLink" until /api/info was surfaced) */
    const fwOld=!!(e.dongle_api&&e.dongle_api_min&&e.dongle_api<e.dongle_api_min);
    const fwCell=e.dongle_fw?(fwOld?chip(e.dongle_fw+" (API "+e.dongle_api+", this WiCAN expects "+e.dongle_api_min+")","warn"):e.dongle_fw+" (API "+e.dongle_api+")"):"—";
    /* the class the mode asks for versus what the host actually bound */
    const wantDrv=e.mode==="usb_rndis"?"rndis":e.mode==="usb_ncm"?"cdc_ncm":null;
    const clsMismatch=!!(wantDrv&&u.eth_connected&&(u.driver==="cdc_ncm"||u.driver==="rndis")&&u.driver!==wantDrv);
    const notes=[];
    if(e.pair_blocked_factory_pw)notes.push(note("warn","Zero-touch pairing is on hold: the access point still uses the factory password. Set a new AP password (see the banner above or the WiFi page); the device restarts and pairing then completes automatically."));
    else if(pst==="hold")notes.push(note("warn","Pairing is on hold: "+(e.last_error||"the dongle key cannot be stored right now.")));
    if(pst==="unsupported"||fwOld)notes.push(note("warn","The dongle firmware is older than this WiCAN expects"+(e.dongle_fw?" ("+e.dongle_fw+")":"")+". Update the dongle firmware, then plug it in again."+(e.last_error&&pst==="unsupported"?" Detail: "+e.last_error:"")));
    if(clsMismatch)notes.push(note("warn","The dongle presents "+(DRV[u.driver]||u.driver)+" although "+modeLabel+" is selected. "+(e.last_error||"The dongle reboots once to switch its USB class; if this persists, update the dongle firmware.")));
    const errInNote=pst==="hold"||pst==="unsupported"||clsMismatch;
    const nlRows=[
      ["Enabled",e.enabled?"yes":"no"],
      ["Mode",modeLabel],
      ["Uplink",chip(up[0],up[1])],
      ["Pairing",chip(ps[0],ps[1])],
      ...(e.last_error&&!errInNote?[["Last pairing error",chip(e.last_error,"warn")]]:[]),
      ["Dongle AP",usbMode?"not used in USB Ethernet mode":(e.ssid||"not paired")],
      ["Device ID",e.device_id||"—"],
      ["Dongle firmware",fwCell],
      ["Dongle address",e.host||"—"],
      ["USB attached",(e.usb||{}).attached?"yes":"no"],
      ["LTE",d.valid?(d.lte_connected?chip((d.operator||"connected")+(d.network_type?" · "+d.network_type:"")+(d.rssi_dbm?" · "+d.rssi_dbm+" dBm":""),"ok"):chip("not connected","warn")):(e.health_unsupported?chip("no health API in this dongle firmware","warn"):"—")],
      ["GPS (dongle)",d.valid?(d.gps_fix?chip("fix","ok"):chip("no fix","")):"—"],
      ["GPS (cached fix)",g.valid?(g.satellites+" sats · "+(g.age_ms/1000).toFixed(1)+" s old"):"—"],
      ["Counters","cuts "+((e.usb||{}).cuts??0)+" · VBUS cycles "+((e.usb||{}).vbus_cycles??0)+" · errors "+((e.usb||{}).errors??0)+" · polls "+(e.polls??0)+" / failed "+(e.failures??0)]];
    nlKv.replaceChildren(...notes,kv(nlRows));
  }
  async function repair(){
    if(!await confirmModal("Power-cycle the dongle's USB rail so it re-enumerates and the WiCAN reads its AP key again? The dongle reboots (GPS re-acquires).","Re-pair dongle"))return;
    try{await api("/api/espnetlink/repair",{method:"POST",body:{}});toast("Re-pair requested","ok");}
    catch(e){toast("Re-pair failed: "+e.message,"err");}
  }
  const pairSsid=h("input",{class:"mono",placeholder:"ESPNetLink_XXXXXX",maxlength:"32"});
  const pairPass=h("input",{class:"mono",type:"password",placeholder:"AP password (dongle console: wifi_modem -k)",maxlength:"64"});
  async function manualPair(){
    if(!pairSsid.value){toast("SSID required","err");return;}
    try{
      const r=await api("/api/espnetlink/pair",{method:"POST",body:{ssid:pairSsid.value,password:pairPass.value}});
      pairPass.value="";
      if(await confirmModal("Paired (Wi-Fi slot "+r.slot+"). Restart WiCAN now to apply?","Pairing saved")){
        try{await api("/api/settings/submit",{method:"POST"});}catch{}expectReboot("Applying pairing");}
    }catch(e){toast("Pair failed: "+e.message,"err");}
  }
  const manual=h("details",{},h("summary",{class:"help",style:"cursor:pointer"},"Manual pairing (no USB cable)"),
    h("div",{class:"frow",style:"margin-top:8px"},h("label",{},"Dongle SSID"),h("div",{class:"ctl"},pairSsid)),
    h("div",{class:"frow"},h("label",{},"AP password"),h("div",{class:"ctl"},pairPass,
      h("div",{class:"help"},"Stores the dongle as a trusted fallback Wi-Fi network and sets it as the ESPNetLink. Zero-touch pairing over USB does this automatically."))),
    h("div",{class:"rowflex",style:"gap:8px;margin-top:6px"},h("button",{class:"btn sm",onclick:manualPair},ic("key"),"Pair")));

  /* ---- ESPNetLink structured status (legacy usb_host tab parity):
     LTE + GPS panels. GPS always from the firmware cache (/api/gps —
     console poll OR the HTTP poll over the dongle's AP/USB); LTE from
     the dongle health poll, or the `lte -j` console when it is bound. ---- */
  const lteKv=h("div",{}),gpsKv=h("div",{});
  const jsonPre=t=>h("pre",{class:"mono",style:"font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;margin:6px 0 0"},t);
  const lteJson=jsonPre("No LTE data available yet."),gpsJson=jsonPre("No GPS data available yet.");
  const subT=t=>h("div",{style:"font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px"},t);
  nlEl.append(
    h("div",{class:"cols2"},
      h("div",{},subT("LTE"),lteKv),
      h("div",{},subT("GPS"),gpsKv)),
    h("div",{class:"cols2",style:"margin-top:10px"},
      h("details",{},h("summary",{class:"help",style:"cursor:pointer"},"Show full LTE data"),lteJson),
      h("details",{},h("summary",{class:"help",style:"cursor:pointer"},"Show full GPS data"),gpsJson)));
  lteKv.append(h("div",{class:"help"},"Waiting for first poll…"));
  gpsKv.append(h("div",{class:"help"},"Waiting for first poll…"));
  function renderLte(l){
    const st=l.stage||"—";
    lteKv.replaceChildren(kv([
      ["Stage",chip(st,st==="connected"?"ok":/connect|start/.test(st)?"warn":"")],
      ["Operator",l.operator||"—"],
      ["Signal",l.status_valid&&l.rssi_dbm?l.rssi_dbm+" dBm":"—"],
      ["Network",l.network_type||"—"],
      ["IP",(l.ip&&l.ip!=="0.0.0.0")?l.ip:"—"],
      ["SIM",l.sim_status||"—"],
      ["Modem",l.modem_model?(l.modem_model+(l.modem_fw?" · "+l.modem_fw:"")):"—"]]));
  }
  function renderLteHealth(d){
    lteKv.replaceChildren(kv([
      ["Stage",chip(d.lte_connected?"connected":"not connected",d.lte_connected?"ok":"warn")],
      ["Operator",d.operator||"—"],
      ["Signal",d.rssi_dbm?d.rssi_dbm+" dBm":"—"],
      ["Network",d.network_type||"—"],
      ["USB data",d.usb_data?"on":"off (power only)"]]));
  }
  function renderGps(g){
    /* /api/gps: contract shape (speed m/s). Also flows to HA as autopid
       gps_* params: this card just mirrors the firmware GPS cache. */
    gpsKv.replaceChildren(kv([
      ["Fix",chip(g.valid?"Fix":"No fix",g.valid?"ok":"")],
      ["Satellites",g.valid?(g.satellites??"—"):"—"],
      ["Location",g.valid?(g.latitude.toFixed(6)+", "+g.longitude.toFixed(6)):"—"],
      ["Speed",g.valid?(g.speed*3.6).toFixed(1)+" km/h":"—"],
      ["Heading",g.valid?(g.heading??0).toFixed(0)+"°":"—"],
      ["Altitude",g.valid?(g.altitude??0).toFixed(0)+" m":"—"],
      ["Accuracy",g.valid&&g.accuracy?"±"+g.accuracy+" m":"—"],
      ["Age",g.valid?(g.age_ms/1000).toFixed(1)+" s":"—"]]));
  }
  function nlExtract(txt){
    const a=txt.indexOf("{"),b=txt.lastIndexOf("}");
    if(a<0||b<=a)return null;
    try{return JSON.parse(txt.slice(a,b+1));}catch{return null;}
  }
  let nlBusy=false,nlTick=0;
  async function nlCmd(cmd){
    const r=await api("/api/usb/acm/cmd",{method:"POST",body:{cmd,timeout_ms:6000}});
    return nlExtract(r.response||"");
  }
  async function nlPoll(force){
    if(nlBusy||conn.state!=="online")return;
    nlBusy=true;
    try{
      /* GPS: the firmware polls the dongle (console or HTTP) and caches
         it: read that (no ACM-lock contention, and it's what HA gets) */
      const g=await tryGet("/api/gps");
      if(g){renderGps(g);gpsJson.textContent=JSON.stringify(g,null,2);}
      /* LTE: the dongle health poll when the link is up; the raw console
         (no /api/lte yet) only when a console is bound, every 3rd tick */
      if(nl&&nl.dongle&&nl.dongle.valid){renderLteHealth(nl.dongle);lteJson.textContent=JSON.stringify(nl.dongle,null,2);}
      else if(nl&&nl.health_unsupported){lteKv.replaceChildren(h("div",{class:"help"},"This dongle firmware has no health API (GET /api/wifi_modem): the LTE state is unavailable until the dongle firmware is updated."));}
      else if(acmOn&&(force||nlTick%3===0)){
        const l=await nlCmd("lte -j");

      }

    finally{nlBusy=false;nlTick++;}
  }
  /* card order: what is happening (status cards) first, then what the
     user can change (settings), the raw console last */
  paneStatus.append(cardTools("USB Connector","route",
    [h("button",{class:"btn sm gh",title:"Refresh",onclick:()=>status()},ic("refresh"))],stEl,
    note("","The USB connector is shared: external serial console, OR ESP host mode (ESPNetLink dongle / USB-Ethernet adapter), OR device mode (network over the cable to a PC). Role changes apply after Submit + restart.")));
  paneStatus.append(cardTools("ESPNetLink","signal",

    nlKv,

  try{

      const host=["enabled","role","prefer_usb_route","ip_mode","cli"];
      return st.ip_mode==="static"?[...host,"static_ip","static_netmask","static_gw"]:host;
    }});
    paneSettings.append(card("USB Settings","settings",...rows));
  }catch(e){paneSettings.append(banner("crit","alert",e.message));}
  let nlTimer=null;
  try{
    const acmRows=await settingsForm("usb_acm_cli");

    const inp=h("input",{class:"mono",placeholder:"console command, e.g. lte -s",
      onkeydown:e=>{if(e.key==="Enter")send(inp.value);}});
    async function send(cmd){if(!cmd)return;out.append(h("div",{class:"in"},"› "+cmd));
      while(nlBusy)await new Promise(r=>setTimeout(r,100)); /* don't 409 against the LTE/GPS poll */
      nlBusy=true;
      try{const r=await api("/api/usb/acm/cmd",{method:"POST",body:{cmd}});
        out.append(h("div",{},r.response||"(no reply)"));}
      catch(e){out.append(h("div",{class:"er"},"error: "+e.message));}
      finally{nlBusy=false;}
      out.scrollTop=out.scrollHeight;inp.value="";}
    const q=(l,c)=>h("button",{class:"btn sm",onclick:()=>send(c)},l);
    consEl.append(
      h("div",{class:"rowflex",style:"gap:8px;flex-wrap:wrap;margin-bottom:8px"},
        q("Signal","lte -s"),q("Operator","lte -o"),q("LTE IP","lte -i"),q("GPS","gps"),q("Version","ver")),
      out,
      h("div",{class:"frow"},h("label",{},"Command"),h("div",{class:"ctl"},inp,
        h("div",{class:"help"},"Talks to the dongle's own console (esp> prompt), not raw AT."))));
    paneConsole.append(
      card("ESPNetLink Console","terminal",consEl,consOff,
        h("div",{class:"subhead"},"Console settings"),
        ...acmRows));
  }catch{/* usb_acm_cli absent in this build */}
  tabbedPage(wrap,"usb",[
    {id:"status",el:paneStatus},
    {id:"settings",el:paneSettings},
    {id:"console",el:paneConsole}],sub);
  await status();
  nlPoll(true);
  nlTimer=setInterval(nlPoll,5000);
  const t=setInterval(()=>{if(conn.state==="online")status();},4000);
  return()=>{clearInterval(t);if(nlTimer)clearInterval(nlTimer);};
};

/* ---- Certificates (cert_manager sets; key material is write-only) ---- */
async function certsCard(){
  const listEl=h("div",{});
  const refresh=async()=>{
    try{const r=await api("/api/certs");
      listEl.replaceChildren(dataTable([
        {label:"Name",get:s=>h("b",{class:"mono",style:"font-weight:600"},s.name)},
        {label:"CA",get:s=>s.ca?chip("yes","ok"):h("span",{class:"help"},"—")},
        {label:"Client Cert",get:s=>s.cert?chip("yes","ok"):h("span",{class:"help"},"—")},
        {label:"Client Key",get:s=>s.key?chip("yes","ok"):h("span",{class:"help"},"—")},
        {label:"",align:"right",get:s=>h("button",{class:"btn sm gh danger",onclick:async()=>{
          if(!await confirmModal("Delete certificate set \""+s.name+"\"? Consumers referencing it fall back to the built-in CA bundle at the next connection.","Delete set"))return;
          try{await api("/api/certs?set="+encodeURIComponent(s.name),{method:"DELETE"});toast("Deleted","ok");refresh();}
          catch(e){toast(e.message,"err");}}},ic("trash"))}
      ],r.sets||[],{empty:"No certificate sets yet: upload one below."}));
    }catch(e){listEl.replaceChildren(banner("crit","alert",e.message));}
  };
  await refresh();
  const name=h("input",{type:"text",maxlength:24,placeholder:"e.g. home_broker",style:"max-width:220px"});
  const files={},resets=[];
  const pickBtn=(type,label)=>{
    const cap=h("span",{},label);
    resets.push(()=>{cap.textContent=label;delete files[type];});
    return h("label",{class:"btn sm"},cap,

        chip("transport: "+(st.backend_setting||"auto"),""),chip("provider: "+provider,""),

  if(!PAGES.__files){const p=page(view,null,"File Manager","Internal flash and SD card");p.append(banner("crit","alert","The File Manager could not be loaded (/ui/files.js). Reload the page, or update the firmware."));return null;}
  return PAGES.__files(view,sub);
};

/* ---- Logs ---- */
PAGES.logs=async(view)=>{
  const p=page(view,null,"Logs","Device log ring and sinks");
  const tag=h("input",{value:"*",style:"width:150px",placeholder:"tag or *",title:"Log tag (component), * = all"});
  const lvl=h("select",{style:"width:160px"},...[["error","Errors only"],["warn","Warnings"],["info","Info"],["debug","Debug"],["verbose","Verbose"]].map(([v,l])=>h("option",{value:v,selected:v==="info"},l)));
  const auto=h("input",{type:"checkbox",checked:true});const sinks=h("div",{class:"rowflex",style:"gap:8px;flex-wrap:wrap"});
  const out=h("div",{class:"console"});
  p.append(section("Controls",null,
    h("div",{class:"rowflex",style:"gap:10px;flex-wrap:wrap"},
      h("span",{class:"help"},"Level for"),tag,lvl,
      h("button",{class:"btn sm",title:"Change the runtime log level for this tag (not persisted)",onclick:async()=>{try{await api("/api/logs/level",{method:"PUT",body:{tag:tag.value||"*",level:lvl.value}});toast("Level set","ok");}catch(e){toast(e.message,"err");}}},"Set level"),
      h("span",{class:"grow"}),h("label",{class:"rowflex",style:"gap:6px;font-size:12px;color:var(--text-2)"},auto,"auto-scroll"),
      h("a",{class:"btn sm gh",href:API+"/api/logs/ring",download:"wican-log.txt",title:"Download the log ring as a text file"},ic("down"),"Download"),
      h("button",{class:"btn sm gh danger",title:"Empty the log ring",onclick:async()=>{try{await api("/api/logs/ring",{method:"DELETE"});out.replaceChildren();toast("Cleared","ok");}catch(e){toast(e.message,"err");}}},ic("trash"),"Clear")),
    h("div",{style:"margin-top:10px"},sinks)),out);
  const ANSI=/\x1b\[[0-9;]*m/g;
  /* classify by the IDF level letter first ("E (123) tag:"); the free-text
     fallback only applies to lines without one (boot banners, panics) */
  const cls=l=>{const m=/^\s*([EWIDV]) \(\d+\)/.exec(l);
    if(m)return m[1]==="E"?"er":m[1]==="W"?"wn":(m[1]==="D"||m[1]==="V")?"dim":"";
    return/abort\(\)|panic|Guru Meditation|assert failed/i.test(l)?"er":/---- boot|rst:|ESP-ROM/i.test(l)?"dim":"";};
  async function ring(){try{const txt=await api("/api/logs/ring");out.replaceChildren(...String(txt).replace(ANSI,"").split("\n").map(l=>h("div",{class:cls(l)},l)));if(auto.checked)out.scrollTop=out.scrollHeight;}catch{}}
  async function sink(){const s2=await tryGet("/api/logs/status");if(!s2)return;sinks.replaceChildren(h("span",{class:"help"},"Dropped "+s2.dropped+" · click a sink to toggle it:"),...(s2.sinks||[]).map(k=>h("button",{class:"chip "+(k.enabled?"ok":""),style:"cursor:pointer;border:none",title:(k.enabled?"Disable":"Enable")+" the "+k.name+" log sink",onclick:async()=>{try{await api("/api/logs/sink",{method:"PUT",body:{name:k.name,enabled:!k.enabled}});sink();}catch(e){toast(e.message,"err");}}},h("span",{class:"d"}),k.name)));}
  await sink();await ring();const t=setInterval(()=>{if(conn.state==="online")ring();},2500);return()=>clearInterval(t);
};

/* ---- System Monitor (tasks / CPU / heap / temperature) ---- */
PAGES.sysmon=async(view)=>{
  const p=page(view,null,"System Monitor","Live tasks, CPU load, heap and die temperature");
  p.classList.add("wide");
  const tilesEl=h("div",{class:"tiles"});
  const faultsEl=h("div",{});
  const heapEl=h("div",{class:"cols2"});
  const taskEl=h("div",{});
  p.append(tilesEl,faultsEl,heapEl,taskEl);
  let prev=null;
  async function refresh(){
    const[st,tk,fl]=await Promise.all([tryGet("/api/status"),tryGet("/api/status/tasks"),tryGet("/api/faults")]);
    if(!st||!tk||!tk.tasks)return;
    /* device fault codes (the automotive-DTC idea for the firmware):
       latched in NVS until MANUALLY cleared: a fault that fired once in
       the field stays visible here */
    const faults=(fl&&fl.faults)||[];
    const ftime=t=>t>0?new Date(t*1000).toLocaleString():"—";
    faultsEl.replaceChildren(section("Fault codes",
      "structural problems latch here and survive reboots until cleared, like DTCs in a car",
      ...(faults.length===0?[h("div",{class:"help"},"No fault codes, device healthy.")]:[
        dataTable([
          {label:"Code",get:r=>chip(r.code,"crit"),mono:true},
          {label:"Detail",key:"detail"},
          {label:"Count",key:"count",align:"right",mono:true},
          {label:"First seen",get:r=>ftime(r.first_time),mono:true},
          {label:"Last seen",get:r=>ftime(r.last_time),mono:true},
        ],faults),
        h("div",{style:"margin-top:10px"},h("button",{class:"btn",onclick:async()=>{
          if(!await confirmModal(faults.length+" latched fault code(s) will be erased from NVS. Investigate before clearing: this is the only record.","Clear faults"))return;
          try{await api("/api/faults/clear",{method:"POST"});toast("Fault codes cleared","ok");refresh();}
          catch(e){toast("Clear failed","err");}
        }},"Clear fault codes"))])));
    const map=new Map(tk.tasks.map(x=>[x.name,x.runtime_us]));
    let rows=tk.tasks.map(x=>({...x,cpu:null}));
    let busy=null;
    if(prev&&tk.total_us>prev.total_us){
      const win=(tk.total_us-prev.total_us)*(tk.cores||2);
      let idle=0;
      rows=tk.tasks.map(x=>{const p0=prev.map.get(x.name);
        const d=p0!=null?Math.max(0,x.runtime_us-p0):0;
        if(/^IDLE/.test(x.name))idle+=d;
        return{...x,cpu:win>0?d/win*100:0};});
      busy=win>0?Math.max(0,100-idle/win*100):null;
    }
    prev={total_us:tk.total_us,map};
    rows.sort((a,b)=>((b.cpu??0)-(a.cpu??0))||(a.stack_hw-b.stack_hw));
    const m=st.memory;
    tilesEl.replaceChildren(
      tile("CPU load",busy==null?"…":busy.toFixed(1),"%",{kind:busy>85?"crit":busy>60?"warn":""}),
      tile("Tasks",rows.length,null),
      tile("Internal free",m?fmt.bytes(m.internal.free):"—",null,{cap:m?"min ever "+fmt.bytes(m.internal.min_free):null,kind:m&&m.internal.free<20480?"crit":m&&m.internal.free<40960?"warn":""}),
      tile("Die temp",st.temp_c!=null?st.temp_c.toFixed(1):"—","°C",{kind:st.temp_c>75?"crit":st.temp_c>60?"warn":""}),
      tile("Log errors",st.health?String(st.health.log_errors):"—",null,{cap:st.health?st.health.log_warnings+" warnings":null,kind:st.health&&st.health.log_errors>0?"crit":""}),
      tile("Flash erases",st.health&&st.health.flash?String(st.health.flash.erases):"—",null,{cap:"since boot",kind:""}));
    if(m)heapEl.replaceChildren(...[["Internal RAM","the scarce heap: radio stacks live here",m.internal],["PSRAM","bulk heap",m.psram]].map(([label,desc,hp])=>
      section(label,desc,
        meter(hp.total-hp.free,hp.total),
        kv([["In use",fmt.bytes(hp.total-hp.free)+" of "+fmt.bytes(hp.total)],["Free now",fmt.bytes(hp.free)],["Lowest ever",fmt.bytes(hp.min_free)],["Largest free block",fmt.bytes(hp.largest_block)]]))));
    const STATE={X:["running","ok"],R:["ready","ok"],B:["blocked",""],S:["suspended","warn"],D:["deleted","crit"]};
    taskEl.replaceChildren(section("Tasks","stack headroom = bytes NEVER used (small = near overflow); CPU % measured between refreshes",
      dataTable([
        {label:"Task",key:"name",mono:true},
        {label:"State",get:r=>{const s2=STATE[r.state]||[r.state,""];return chip(s2[0],s2[1]);}},
        {label:"Core",get:r=>r.core<0?"any":String(r.core),align:"right"},
        {label:"Prio",key:"prio",align:"right"},
        {label:"Stack headroom",get:r=>r.stack_hw<512?chip(fmt.bytes(r.stack_hw),r.stack_hw<256?"crit":"warn"):fmt.bytes(r.stack_hw),align:"right",mono:true},
        {label:"CPU %",get:r=>r.cpu==null?"…":(r.cpu>0&&r.cpu<0.05?"<0.1":r.cpu.toFixed(1)),align:"right",mono:true},
      ],rows)));
  }
  await refresh();const t=setInterval(()=>{if(conn.state==="online")refresh();},2000);return()=>clearInterval(t);
};

/* ---- All Settings ---- */
PAGES.allsettings=async(view)=>{
  const p=page(view,null,"All Settings","Every component: forms generated from the device schema");
  p.classList.add("wide");
  let comps=[];try{const r=await api("/api/settings");comps=(r.components||r).filter(c=>!HIDE.has(c.name));}catch(e){p.append(banner("crit","alert","Cannot list settings: "+e.message));return null;}
  comps.sort((a,b)=>niceName(a.name).localeCompare(niceName(b.name)));
  const acc=h("div",{style:"display:flex;flex-direction:column;gap:10px"});p.append(acc);
  for(const c of comps){
    const body=h("div",{style:"display:none;padding:2px 22px 14px"});let loaded=false;
    const head=h("button",{class:"legend",style:"width:100%;border:none;background:transparent;cursor:pointer;text-align:left;padding:14px 22px",onclick:async()=>{const open=body.style.display!=="none";body.style.display=open?"none":"block";head.querySelector(".chev").textContent=open?"▾":"▴";if(!open&&!loaded){loaded=true;body.replaceChildren(loading());try{const rows=await settingsForm(c.name);body.replaceChildren(...(rows.length?rows:[h("div",{class:"empty"},"no configurable fields")]));}catch(e){body.replaceChildren(banner("crit","alert",e.message));}}}},
      h("h3",{},niceName(c.name)),c.degraded?chip("check settings","crit"):null,c.pending_reboot?chip("restart pending","warn"):null,
      h("span",{class:"grow"}),h("code",{style:"color:var(--text-3);font-size:11px"},c.name),h("span",{class:"chev",style:"color:var(--text-3)"},"▾"));
    acc.append(h("div",{class:"section"},head,body));
  }
  return null;
};

const NICE={wifi_manager:"Wi-Fi",ble_manager:"Bluetooth",mqtt_manager:"MQTT",autopid:"AutoPID",vpn_manager:"VPN",data_logger:"Logger",sleep_manager:"Power saving",event_manager:"Automation rules",can_manager:"CAN bus",j2534_server:"J2534",usb_host_manager:"USB",led_manager:"LED",socket_manager:"Socket servers",bridge_manager:"Bridges",websocket_manager:"WebSocket channels",script_engine:"Scripts",obd_chip:"OBD chip",battery_monitor:"Battery",imu_manager:"Motion (IMU)",rtc_manager:"Clock",mdns_manager:"mDNS",cert_manager:"Certificates",usb_acm_cli:"Dongle console (USB serial)",espnetlink:"ESPNetLink",uds_manager:"UDS",interface_manager:"Radio arbitration",dev_status_manager:"Status flags",external_storage:"SD card",filesystem:"Filesystem",restart_tracker:"Restart tracking",log_manager:"Logging",cmdline_manager:"Console",ha_webhooks:"Home Assistant",mqtt_can:"CAN over MQTT",http_server_manager:"Web server",obd_gate:"OBD gate",iperf_manager:"iPerf (throughput test)",log_sinks:"Log sinks",button_manager:"Button"};
const HIDE=new Set(["main_bench"]);
function niceName(n){return NICE[n]||n.replace(/_manager$/,"").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase());}
async function boot(){
  const[list,info]=await Promise.all([tryGet("/api/settings"),tryGet("/api/info")]);
  conn.settings=(list&&list.components)||[];
  conn.info=info||{}; /* device_id / model / fw: /api/status has no id */
  renderSubmit();
  await ping();refreshSleep();route();
}
boot();
