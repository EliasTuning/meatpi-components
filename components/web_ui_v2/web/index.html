const BR_PROTOS=["raw","slcan","gvret","realdash"];
async function bridgesCard(){
  const[bm,sm,wm]=await Promise.all(["bridge_manager","socket_manager","websocket_manager"].map(c=>api("/api/settings/"+c)));
  [bm,sm,wm].forEach(o=>{delete o.degraded;delete o.pending_reboot;});
  /* edits staged but not yet submitted stay visible across a re-render
     (the shortcut from the Socket servers card relies on it, 2026-10-16) */
  [["bridge_manager",bm],["socket_manager",sm],["websocket_manager",wm]].forEach(([c,o])=>{const p=store.pending.get(c);if(p)Object.assign(o,p);});
  const servers=sm.servers||[],channels=wm.channels||[];
  const IF=new Set(BR_IFACES.map(x=>x[0]));
  const rows=[],passthru=[];
  /* the device's own word on each bridge (2026-10-29): /api/bridges carries
     `reason` for an enabled bridge that did not build at the last start
     (the endpoint its row names does not exist on this device) */
  const live=await tryGet("/api/bridges");
  const reasonOf=name=>{const x=live&&(live.bridges||[]).find(b=>b.name===name);return x&&x.up===false&&x.reason?x.reason:"";};
  /* A row whose connection side is a jack the device does not have (a server
     or channel renamed or removed under it, a name typed under All Settings):
     the name the card itself gives a TCP/UDP server (tcp3300, udp3333) is read
     back into an editable row, so the next Submit re-creates the server or
     the row's trash button removes it; any other name stays a custom bridge
     with a Remove button. Until 2026-10-29 such rows were shown with no way
     out and the firmware refused every save of the list that still carried
     them (the field report: two rows, udp3333 and udp23, locked a device out
     of all its settings pages). */
  const JACK_RE=/^(tcp|udp)(\d{1,5})$/;
  for(const b of(bm.bridges||[])){
    let iface=null,conn=null;
    if(IF.has(b.a)){iface=b.a;conn=b.b;}else if(IF.has(b.b)){iface=b.b;conn=b.a;}
    if(!iface){passthru.push(b);continue;}
    const sv=servers.find(s=>s.name===conn),ch=channels.find(c=>c.name===conn);
    const r={name:b.name,iface,translator:b.translator||"raw",enabled:b.enabled!==false};
    if(sv){r.conn=sv.proto==="udp"?"udp":"tcp";r.port=sv.port;}
    else if(ch){r.conn="ws";r.path=ch.path;}
    else if(conn==="ble")r.conn="ble";
    else if(conn==="usb_obd")r.conn="usb";
    else{const m=JACK_RE.exec(conn);
      if(!m){b.missing=conn;passthru.push(b);continue;}
      r.conn=m[1];r.port=Number(m[2]);r.missing=conn;}
    rows.push(r);
  }
  /* nothing is staged until the user edits a row: the compiled list differs
     from the stored one in order and in the a/b side for a device set up
     elsewhere (the raw editor, an older build), and a stage on open used to
     light the Submit button and carry a list the user never touched into
     every later save, from any page (2026-10-29) */
  let touched=!!BR_PREFILL;
  if(BR_PREFILL){rows.push(BR_PREFILL);BR_PREFILL=null;}
  const listEl=h("div",{style:"display:flex;flex-direction:column;gap:8px"});
  const warnEl=h("div",{style:"display:flex;flex-direction:column;gap:6px"});
  const canInfo=await tryGet("/api/can");
  function compile(){
    const srv=servers.map(s=>({...s})),chn=channels.map(c=>({...c}));
    const bridges=passthru.map(b=>({...b})),errs=[],used=new Map();
    const claim=(jack,label,en)=>{if(!en||BR_MULTI.has(jack))return;
      if(used.has(jack))errs.push(label+": "+jack+" is already used by "+used.get(jack)+": one connection per interface (disable one).");
      else used.set(jack,label);};
    for(const b of bridges){claim(b.a,b.name,b.enabled!==false);claim(b.b,b.name,b.enabled!==false);}
    let canUsed=false;
    rows.forEach((r,i)=>{
      const label="connection "+(i+1);let jack=null;
      if(r.iface==="can")canUsed=r.enabled||canUsed;
      if(r.conn==="tcp"||r.conn==="udp"){
        const port=Number(r.port)||0;
        if(port<1||port>65535){errs.push(label+": enter a port (1–65535).");return;}
        let s=srv.find(x=>x.proto===r.conn&&Number(x.port)===port);
        if(!s){
          const name=(r.conn+String(port)).slice(0,15);
          if(srv.length<4)srv.push(s={name,proto:r.conn,port,enabled:true});
          else{s=srv.find(x=>x.enabled===false&&!srv.some(y=>y!==x&&y.name===name));
            if(!s){errs.push(label+": no free server slot (max 4): remove one under All Settings → Socket servers.");return;}
            s.name=name;s.proto=r.conn;s.port=port;}
        }
        s.enabled=s.enabled||r.enabled;jack=s.name;
      }else if(r.conn==="ws"){
        const path=String(r.path||"");
        if(!/^\/ws\/[\w./-]{1,26}$/.test(path)){errs.push(label+": WebSocket path must start with /ws/ (max 31 chars).");return;}
        let c=chn.find(x=>x.path===path);
        if(!c){
          const name=("ws_"+path.slice(4).replace(/\W/g,"")).slice(0,15)||("wsbr"+(i+1));
          if(chn.length<6)chn.push(c={name,path,mode:"binary",enabled:true}); /* WEBSOCKET_MANAGER_MAX_CHANNELS */
          else{c=chn.find(x=>x.enabled===false);
            if(!c){errs.push(label+": no free WebSocket channel (max 6): remove one under All Settings → WebSocket channels.");return;}
            c.name=name;c.path=path;c.mode="binary";}
        }
        c.enabled=c.enabled||r.enabled;jack=c.name;
      }else if(r.conn==="ble")jack="ble";
      else if(r.conn==="usb")jack="usb_obd";
      else{errs.push(label+": pick a connection type.");return;}
      if(bridges.length>=BR_MAX){errs.push(label+": max "+BR_MAX+" connections.");return;}
      const name=r.name||("br"+(i+1));
      const tr=r.iface==="can"?(r.translator||"raw"):"raw";
      claim(r.iface,name,r.enabled);claim(jack,name,r.enabled);
      bridges.push({name,a:r.iface,b:jack,translator:tr,enabled:!!r.enabled});
    });
    return{bridges,srv,chn,errs,canUsed};
  }
  function stage(){
    const c=compile();
    warnEl.replaceChildren(
      ...c.errs.map(e=>banner("warn","alert",e)),
      c.canUsed&&canInfo&&canInfo.enabled===false?banner("info","activity","A connection uses the CAN bus but the CAN interface is disabled: enable it in the CAN Interface card above."):null,
      ...brOrphans(c.srv,c.bridges).map(s=>banner("warn","alert",h("b",{},brWhere(s)+" is switched on but no connection uses it. "),"A client can connect to it and gets nothing. ",
        h("button",{class:"btn sm","data-orphan":s.name,type:"button",style:"margin-left:6px",onclick:()=>{if(rows.length+passthru.length>=BR_MAX)return toast("Max "+BR_MAX+" connections","err");rows.push(brRowForServer(s));edit();}},
          ic("plus"),"Add a CAN bus connection on "+String(s.proto||"tcp").toUpperCase()+" "+s.port+" ("+brProtoForPort(s.port)+")"))));
    if(c.errs.length||!touched)return;
    if(JSON.stringify(c.bridges)!==JSON.stringify(bm.bridges||[]))store.stage("bridge_manager",{bridges:c.bridges});
    if(JSON.stringify(c.srv)!==JSON.stringify(servers))store.stage("socket_manager",{servers:c.srv});
    if(JSON.stringify(c.chn)!==JSON.stringify(channels))store.stage("websocket_manager",{channels:c.chn});
  }
  function rowBox(r,i){
    const sel=(opts,cur,cb,key)=>h("select",{"data-sel":key,onchange:e=>{cb(e.target.value);edit();}},...opts.map(([v,l])=>h("option",{value:v,selected:v===cur},l)));
    const line1=h("div",{class:"brline"},
      sel(BR_IFACES,r.iface,v=>{r.iface=v;if(v!=="can")r.translator="raw";},"iface"),
      h("span",{class:"brarrow"},"⇄"),
      sel(BR_CONNS,r.conn||"",v=>{r.conn=v;
        if(v==="ws"&&!r.path)r.path="/ws/br"+(i+1);
        if((v==="tcp"||v==="udp")&&!r.port)r.port=3300+i;},"conn"),
      switchCtl(!!r.enabled,v=>{r.enabled=v;edit();},{sm:true,yes:"Enabled",no:"Disabled",title:"Enable or pause this connection"}),
      h("button",{class:"btn sm gh danger","data-remove":r.name||"",type:"button",title:"Remove this connection",onclick:()=>{rows.splice(i,1);edit();}},ic("trash")));
    const detail=h("div",{class:"rowflex",style:"gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center"});
    if(r.conn==="tcp"||r.conn==="udp")detail.append(
      h("span",{class:"help"},"Port"),
      h("input",{type:"number","data-port":"",min:1,max:65535,value:r.port??"",style:"max-width:110px",onchange:e=>{r.port=Number(e.target.value);edit();}}));
    if(r.conn==="ws")detail.append(
      h("span",{class:"help"},"Path"),
      h("input",{class:"mono","data-path":"",value:r.path||"",placeholder:"/ws/mybridge",style:"max-width:200px",onchange:e=>{r.path=e.target.value;edit();}}));
    if(r.iface==="can")detail.append(
      h("span",{class:"help"},"Protocol"),
      sel(BR_PROTOS.map(x=>[x,x]),r.translator||"raw",v=>{r.translator=v;},"translator"));
    if(r.conn==="ble")detail.append(h("span",{class:"help"},"Uses the BLE data pipe (pair from the app)."));
    if(r.conn==="usb")detail.append(h("span",{class:"help"},"USB port-B serial channel."));
    const why=r.missing?"":reasonOf(r.name);
    return h("div",{"data-row":r.name||"new","data-missing":r.missing||"",style:"border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface-2)"},
      line1,detail.childNodes.length?detail:null,
      r.missing?h("div",{style:"margin-top:8px"},banner("warn","alert",h("b",{},r.missing+" does not exist on this device. "),
        "The server this connection used was renamed or removed. Submit re-creates it as "+String(r.conn).toUpperCase()+" "+r.port+", or remove the connection.")):null,
      why?h("div",{class:"help",style:"margin-top:6px"},"Not running since the last restart: "+why+"."):null);
  }
  function refresh(){
    listEl.replaceChildren(
      ...passthru.map(b=>{const why=b.missing?"":reasonOf(b.name);
        return h("div",{class:"help","data-custom":b.name,style:"padding:4px 2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap"},
        h("span",{},"custom bridge ",h("code",{},b.name),": ",h("code",{},b.a)," ⇄ ",h("code",{},b.b),
          b.missing?[": ",h("b",{},b.missing+" does not exist on this device"),", a server or channel renamed or removed under it. Remove it, or add the server or channel back under All Settings."]
          :why?[": not running since the last restart, "+why+". Edit it under All Settings → Bridges, or remove it."]

      ...rows.map((r,i)=>rowBox(r,i)));

/* Backup (fallback) STA networks: only populated slots render; Add
   claims the next free slot. Writes the flat fallbackN_* keys. */
function fallbackNetworks(vals,stage){
  const open=new Set();
  const list=h("div",{style:"display:flex;flex-direction:column;gap:8px"});
  const add=h("button",{class:"btn sm",type:"button",onclick:()=>{
    for(const i of[1,2,3,4,5]){
      if(String(vals["fallback"+i+"_ssid"]||"")===""&&!open.has(i)){open.add(i);break;}
    }
    rebuild();}},ic("plus"),"Add backup network");
  function rebuild(){
    const act=[1,2,3,4,5].filter(i=>String(vals["fallback"+i+"_ssid"]||"")!==""||open.has(i));
    list.replaceChildren(...act.map(i=>{
      const k=s=>"fallback"+i+"_"+s;
      const ipRow=h("div",{class:"rowflex",style:"gap:8px;flex-wrap:wrap;margin-top:8px"});
      const paintIp=()=>{
        const stat=vals[k("ip_mode")]==="static";
        ipRow.replaceChildren(
          h("select",{onchange:e=>{vals[k("ip_mode")]=e.target.value;stage();paintIp();}},
            h("option",{value:"dhcp",selected:!stat},"DHCP"),
            h("option",{value:"static",selected:stat},"Static IP")),
          ...(stat?[
            h("input",{class:"mono",value:vals[k("static_ip")]||"",placeholder:"IP address",style:"max-width:130px",
              onchange:e=>{vals[k("static_ip")]=e.target.value;stage();}}),
            h("input",{class:"mono",value:vals[k("static_netmask")]||"255.255.255.0",placeholder:"netmask",style:"max-width:130px",
              onchange:e=>{vals[k("static_netmask")]=e.target.value;stage();}}),
            h("input",{class:"mono",value:vals[k("static_gw")]||"",placeholder:"gateway (optional)",style:"max-width:150px",
              onchange:e=>{vals[k("static_gw")]=e.target.value;stage();}})]:[]));
      };
      paintIp();
      return h("div",{style:"border:1px solid var(--border);border-radius:9px;padding:8px 12px;background:var(--surface-2)"},
        h("div",{class:"rowflex",style:"justify-content:space-between;margin-bottom:6px"},
          h("b",{style:"font-size:12px"},"Backup network"),
          h("button",{class:"btn sm gh danger",type:"button",onclick:()=>{
            vals[k("ssid")]="";vals[k("password")]="";vals[k("trusted")]=true;vals[k("vpn_pause")]=false;
            vals[k("ip_mode")]="dhcp";vals[k("static_ip")]="";vals[k("static_gw")]="";
            open.delete(i);stage();rebuild();}},ic("trash"))),
        h("div",{class:"rowflex",style:"gap:8px;flex-wrap:wrap"},
          h("input",{value:vals[k("ssid")]||"",placeholder:"SSID",style:"max-width:180px",
            onchange:e=>{vals[k("ssid")]=e.target.value;stage();}}),
          h("input",{type:"password",value:vals[k("password")]||"",placeholder:"password",
            autocomplete:"new-password",style:"max-width:180px",
            onchange:e=>{vals[k("password")]=e.target.value;stage();}}),
          h("label",{class:"rowflex",style:"gap:6px;font-size:12px;color:var(--text-2)"},
            h("input",{type:"checkbox",checked:vals[k("trusted")]!==false,
              onchange:e=>{vals[k("trusted")]=e.target.checked;stage();}}),"trusted"),
          /* Pause VPN per network (issue #976, 2026-10-11): the VPN stays
             down while the station is on this network */
          h("label",{class:"rowflex",style:"gap:6px;font-size:12px;color:var(--text-2)",title:"The VPN stays down while WiCAN is on this network and comes back as soon as it leaves"},
            h("input",{type:"checkbox",checked:vals[k("vpn_pause")]===true,
              onchange:e=>{vals[k("vpn_pause")]=e.target.checked;stage();}}),"pause VPN")),
        ipRow);
    }));
    add.style.display=act.length>=5?"none":"";
  }
  rebuild();
  return h("div",{class:"frow"},h("label",{},"Backup networks"),
    h("div",{class:"ctl"},list,h("div",{style:"margin-top:8px"},add)),
    h("div",{class:"help"},"Tried in priority order when the main network is unavailable; the device roams back when a higher-priority network reappears. Leave a password blank to keep the stored one."));
}

PAGES.settings=async(view,sub)=>{
  const p=page(view,null,"Settings","WiFi, Bluetooth, CAN interface, connections and MQTT. Changes apply from the Submit button in the header.");
  const wrap=h("div",{class:"pane"});p.append(wrap);
  /* the WiFi mode is not an access-point setting (meatpi 2026-09-07): it gets

        {label:"RSSI",align:"right",mono:true,get:n=>(n.rssi||"?")+" dBm"},

    const wifiVals=await api("/api/settings/wifi_manager");

    const props=Object.keys((wifiSchema&&wifiSchema.properties)||{});
    const FB=/^fallback\d+_/;

    /* no open access point (meatpi 2026-09-07): the firmware enum lost it in v7;
       an older build still offers it in the schema, so drop it here too */

    if(authSpec&&Array.isArray(authSpec.enum))authSpec.enum=authSpec.enum.filter(v=>v!=="open");
    /* ONE shared values object for both wifi cards (separate copies
       would clobber each other's staged edits) */
    const shared={values:wifiVals,schema:wifiSchema};
    const staBits=h("div",{});
    const staOff=h("div",{class:"empty",style:"display:none"},"The station is off in this mode. Pick Station only or Access point + Station above to join a network.");

    const apOff=h("div",{class:"empty",style:"display:none"},"The access point is off in this mode. Pick Access point only or Access point + Station above to let phones connect directly.");

    const paintLive=()=>{const w=conn.wifi,b=(conn.status&&conn.status.bits)||{};

      {v:"ap",t:"Access point only",i:"wifi",d:"Phones and laptops connect directly to the WiCAN. It gets no internet."},

        h("div",{class:"wt"},ic(m.i),m.t),h("div",{class:"wd"},m.d))));

    /* why the station is not connected (2026-09-06): the firmware keeps the
       last attempt's entry + disconnect reason + failed-attempt streak;
       there is no time-based ban any more: a rejected entry is tried
       after the other networks, and alone it keeps being tried */
    const REASON_TXT={2:"the network dropped the session",15:"the handshake timed out",200:"the network's beacons were lost",201:"the network was not found",202:"authentication failed",203:"association failed",204:"the handshake timed out",205:"the connection failed"};

/* Save model: settings cards stage into the ONE header Submit button
   (reboot-to-apply): the per-card "Submit to apply" badge was dropped
   2026-09-05; only live-apply cards are marked with liveBadge. */
/* Sub-tabs for long pages: every pane is built once (staged edits and
   live pollers survive tab switches); a tab only toggles visibility and
   rewrites the hash with replaceState so #/<page>/<tab> deep-links work
   without re-running the page. The sidebar accordion (buildMenu) is the
   primary tab control: tab ids + labels come from NAV[].sub; the
   in-page strip is only shown on narrow windows, where the sidebar
   collapses to a chip row that cannot nest. */
function tabbedPage(container,base,tabs,sub){
  const def=((NAV.find(n=>n.r===base)||{}).sub)||[];
  tabs.forEach(t=>{const d=def.find(x=>x.id===t.id);
    if(!d&&def.length)console.warn("tabbedPage: '"+base+"/"+t.id+"' is missing from NAV.sub");
    t.label=t.label||(d?d.t:t.id);});
  const active=tabs.some(t=>t.id===sub)?sub:tabs[0].id;
  const strip=h("div",{class:"subtabs",role:"tablist"});
  const panes=h("div",{class:"pane"});
  const show=id=>{tabs.forEach(t=>{t.el.style.display=t.id===id?"":"none";});
    strip.querySelectorAll(".subtab").forEach(a=>a.classList.toggle("on",a.dataset.id===id));
    navSubMark(base,id);
    try{history.replaceState(null,"","#/"+base+"/"+id);}catch{}};
  tabs.forEach(t=>{strip.append(h("a",{class:"subtab",role:"tab",href:"#/"+base+"/"+t.id,"data-id":t.id,
    onclick:e=>{e.preventDefault();show(t.id);}},t.label));panes.append(t.el);});
  subNav={base,show};
  container.append(strip,panes);show(active);
}

    /* shared helpers since 2026-10-01: profileToPids / vehicleProfilePicker

  const p=page(view,null,"Power Saving","Sleep behaviour to protect the vehicle battery.");
  const wrap=h("div",{});p.append(wrap);
  try{const rows=await settingsForm("sleep_manager",null,
      {advancedExcept:["enabled","sleep_mv","wake_mv","wake_delay_ms","sleep_delay_min","periodic_wakeup","wakeup_interval_min"],
       /* progressive disclosure: nothing but the switch while sleep is off;
          the wake-up interval only once periodic wake-up is on */
       visible:st=>!st.enabled?["enabled"]:(st.periodic_wakeup?null:["enabled","sleep_mv","wake_mv","wake_delay_ms","sleep_delay_min","periodic_wakeup","cli"])});
    const st=await tryGet("/api/sleep");
    /* meatpi 2026-09-07: anything motion/wake related must be visible here. "Wake on
       motion" (the IMU's bump detector) ships off; when it is on, say so: and say what
       it really does: bump events for rules, no wake from sleep. */
    const imu=await tryGet("/api/settings/imu_manager");
    if(imu&&imu.enabled&&imu.wom)
      wrap.append(banner("warn","activity",h("b",{},"Wake on motion is on"),
        " (Advanced → Motion (IMU)). It publishes a bump event on a knock or door slam for rules and MQTT; it does not wake the WiCAN from sleep. ",
        h("a",{href:"#/advanced"},"Open Advanced")));
    wrap.append(cardTools("Sleep Mode","battery",[],
      st?h("div",{class:"rowflex",style:"gap:8px;margin-bottom:10px;flex-wrap:wrap"},
        chip(st.state||"normal",st.state==="normal"?"ok":"warn"),
        st.voltage!=null?chip(st.voltage.toFixed(1)+" V","info"):null):null,
      ...rows,
      /* the floor is a rule of its own, not a footnote of the sleep switch
         (meatpi 2026-10-06): it cuts a longer sleep delay short too */
      note("","Critical battery floor: under "+(st&&st.critical_v?st.critical_v.toFixed(1):"11.9")+" V for "+fmtSpan(st&&st.critical_s?st.critical_s:300)+" WiCAN goes to sleep without waiting for a longer sleep delay, and with sleep mode off too. It wakes at the wake-up voltage."),
      note("","Keep awake: while a countdown runs, the bar at the top offers ten more minutes, and the page asks one minute before the entry. A press moves the sleep delay and the critical floor out by ten minutes, three times per start; nothing is saved and a restart drops it."),
      note("warn","Disabling sleep continuously drains the vehicle battery when the engine is off. Only disable for testing.")));
  }catch(e){wrap.append(banner("crit","alert",e.message));}
  return null;
};

/* ---- Logger ---- */
/* Two streams (polled parameters and raw CAN frames) each with its own
   format, rotation and retention. Reworked 2026-09-06 (meatpi): a status
   that reads the real card state, one chip per state and per-stream
   figures; settings split per stream with progressive disclosure, live
   per-format guidance, retention totals checked against the card size,
   a guided CAN filter (all frames / matching IDs, 11- or 29-bit,
   sanitised hex, the matched range spelled out) and the newest log files
   on the page with the write-locked active files marked. ONE shared
   values object backs every data_logger form so the staged PUT carries
   all edits together. */
const LOG_FMT_HELP={
  params:{sqlite:"One .db file per rotation (params + records tables): opens in any SQLite tool.",
    csv:"ts_ms, source.name, value per line: spreadsheets and pandas.",
    binary:"Compact .wdl records: convert on a PC with tools/wdl_dump.py.",
    jsonl:"One JSON object per line: jq, pandas, anything."},
  can:{binary:"Compact .wdl: the fastest option for a busy bus; convert on a PC with tools/wdl_dump.py (csv, candump, PEAK trc).",
    csv:"ts_ms, id, ext, rtr, dlc, data per line: fine for a filtered or quiet bus.",
    sqlite:"Slow (about 700 frames/s): only for a filtered or quiet bus; a busy bus overflows the frame buffer.",
    mf4:"ASAM MDF 4.10: asammdf, CANoe, MATLAB, INCA. Starts a fresh file every boot.",
    blf:"Vector BLF. CANoe / CANalyzer, python-can. Starts a fresh file every boot.",
    candump:"SocketCAN text (.log): can-utils replay, SavvyCAN import.",
    asc:"Vector ASC text. CANalyzer / CANoe. Starts a fresh file every boot.",
    jsonl:"One JSON object per line: jq, pandas, anything."}};
const LOG_EXT_NAME={db:"SQLite",csv:"CSV",wdl:"Binary",jsonl:"JSON lines",mf4:"MDF4",blf:"BLF",log:"candump",asc:"ASC"};
/* The clock's history (2026-10-13, issue #984). /api/rtc.clock says who set
   the system clock and how far it last moved; /api/logger.clock what the
   logger did about it; /sd/logs/clock.jsonl (the clock journal) lists every
   set with the files that were open. Words for all three, and the per-file
   re-base the dashboard's history applies to rows written before a step. */
const CLOCK_SRC={none:"nobody",rtc:"the RTC chip",sntp:"SNTP",manual:"a manual set"};
function clockDelta(ms){const a=Math.abs(ms),s=ms<0?"-":"+";
  if(a<1000)return s+a+" ms";if(a<120000)return s+Math.round(a/1000)+" s";if(a<7200000)return s+Math.round(a/60000)+" min";
  if(a<172800000)return s+(a/3600000).toFixed(1).replace(/\.0$/,"")+" h";if(a<63072000000)return s+Math.round(a/86400000)+" days";return s+Math.round(a/31557600000)+" years";}
function clockWords(rtc){
  if(!rtc)return "-";
  if(!rtc.valid)return "not set, waiting for an internet time sync (log rows carry the uptime since boot)";
  const c=rtc.clock;if(!c)return rtc.time;
  let s=rtc.time+" · set by "+(CLOCK_SRC[c.source]||c.source);
  const ls=c.last_step;
  if(ls&&c.steps_this_boot>1&&Math.abs(ls.delta_ms)>=1000)s+=", last moved "+clockDelta(ls.delta_ms)+" by "+(CLOCK_SRC[ls.source]||ls.source);
  return s;
}
function loggerClockWords(c,rtc){
  if(!c)return "";
  if(!c.valid)return "Clock: not set. Rows carry the uptime since boot until an internet time sync or a manual set; the clock journal and the file list say so.";
  const ls=rtc&&rtc.clock&&rtc.clock.last_step;
  let s="Clock: set by "+(CLOCK_SRC[c.source]||c.source);
  if(ls&&ls.at)s+=" at "+ls.at.replace("T"," ").replace("Z"," UTC");
  if(ls&&c.steps_this_boot>1&&Math.abs(ls.delta_ms)>=60000)s+=", a step of "+clockDelta(ls.delta_ms)+" this boot";
  else if(c.steps_this_boot>1)s+=", "+(c.steps_this_boot-1)+" small step"+(c.steps_this_boot>2?"s":"")+" this boot";
  if(c.rotations_by_clock)s+=" ("+c.rotations_by_clock+" file"+(c.rotations_by_clock>1?"s":"")+" rotated by the clock)";
  return s+".";
}
async function loadClockJournal(){
  try{const r=await fetch(API+"/api/fs/download?path="+encodeURIComponent("/sd/logs/clock.jsonl").replace(/%2F/gi,"/"),{cache:"no-store"});return r.ok?journalFromText(await r.text()):new Map();}
  catch(e){return new Map();}
}
/* file name -> the steps that happened while it was open: {before, after, delta, origin, unsynced} */
function journalFromText(txt){
  const m=new Map();let origin=null;
  for(const line of String(txt||"").split("\n")){if(!line.trim())continue;let e;try{e=JSON.parse(line);}catch(x){continue;}
    if(e.ev==="boot"){origin=(Number(e.ts)||0)-(Number(e.up_ms)||0);continue;}
    if(e.ev!=="valid"&&e.ev!=="step")continue;
    for(const f of(e.files||[])){let a=m.get(f);if(!a){a=[];m.set(f,a);}a.push({before:Number(e.ts_before),after:Number(e.ts_after),delta:Number(e.delta_ms)||0,origin,unsynced:e.ev==="valid"});}
    if(origin!=null)origin+=Number(e.delta_ms)||0;   /* the boot's origin follows the clock through its later steps */}
  return m;
}
/* a row's stamp as the corrected clock would have written it: every step
   that happened while its file was open and after the row (a row from an
   earlier boot in a resumed file keeps its stamp) */
function journalShift(j,file,ts){
  const a=j&&file?j.get(file):null;if(!a||!Number.isFinite(ts))return ts;
  let t=ts;for(const s of a){if(t<=s.before&&(s.origin==null||t>=s.origin-5000))t+=s.delta;}return t;
}

PAGES.terminal=async(view)=>{
  const p=page(view,null,"Terminal","Interactive command line: the WiCAN console or an ELM327 terminal on the OBD interface.");
  const typeSel=h("select",{style:"width:230px"},
    h("option",{value:"console"},"WiCAN Command Line"),
    h("option",{value:"elm327"},"ELM327"));
  const connBtn=h("button",{class:"btn pri"},"Connect");
  const badge=chip("Disconnected","crit");
  const title=h("span",{class:"tt"},"wican-console: /ws/cli");
  const out=h("pre",{class:"term-body"},"");
  const cursor=h("span",{style:"animation:blink 1.1s step-start infinite"},"▋");
  const prompt=h("span",{class:"pr"},"wican>");
  const input=h("input",{placeholder:"Connect to start",disabled:true,autocomplete:"off",spellcheck:"false"});
  const sendBtn=h("button",{class:"btn sm",disabled:true},"Send");
  const readyEl=h("div",{});
  p.append(
    h("div",{class:"rowflex",style:"flex-wrap:wrap;gap:11px"},
      h("span",{style:"font-size:13px;font-weight:600;color:var(--text-2)"},"Terminal type"),
      typeSel,connBtn,h("span",{class:"grow"}),badge),
    readyEl,
    h("div",{class:"term"},
      h("div",{class:"term-head"},h("span",{class:"td1"}),h("span",{class:"td2"}),h("span",{class:"td3"}),title),
      out,
      h("div",{class:"term-in"},prompt,input,sendBtn)));
  out.append(cursor);
  let ws=null,hist=[],hi=0;
  const dec=new TextDecoder();
  const put=t=>{cursor.remove();out.append(t);out.append(cursor);out.scrollTop=out.scrollHeight;};
  /* ---- readiness: the terminal only works when a WebSocket channel is
     bridged to the console (cli ⇄ /ws/cli) or the OBD chip (obd ⇄ /ws/obd).
     A fresh device ships with ws_cli DISABLED and no cli bridge, so
     "Connect" used to fail silently for every new user (meatpi 2026-09-05).
     Detect it, say so, and offer a one-click staged fix. ---- */
  const TERM={console:{iface:"cli",path:"/ws/cli",bridge:"br_cli",mode:"text",label:"WiCAN console",row:"Console (CLI) ⇄ WebSocket"},
              elm327:{iface:"obd",path:"/ws/obd",bridge:"br_obd",mode:"binary",label:"ELM327 terminal",row:"OBD chip ⇄ WebSocket"}};
  let wm=null,bm=null,stagedHere=false;
  const strip=o=>{const c={...o};delete c.degraded;delete c.pending_reboot;return c;};
  async function loadBridges(){
    const[w,b]=await Promise.all(["websocket_manager","bridge_manager"].map(c=>tryGet("/api/settings/"+c)));
    wm=w?strip(w):null;bm=b?strip(b):null;
  }
  function bridgeState(t){
    if(!wm||!bm)return null; /* unknown → don't block the user */
    const ch=(wm.channels||[]).find(c=>c.path===t.path);
    const br=ch&&(bm.bridges||[]).find(x=>(x.a===t.iface&&x.b===ch.name)||(x.b===t.iface&&x.a===ch.name));
    return{ch,br,ready:!!(ch&&ch.enabled!==false&&br&&br.enabled!==false)};
  }
  function stageBridge(t){
    const w={channels:(wm.channels||[]).map(c=>({...c}))},b={bridges:(bm.bridges||[]).map(x=>({...x}))};
    let ch=w.channels.find(c=>c.path===t.path);
    if(!ch){
      if(w.channels.length>=6)return toast("No free WebSocket channel: remove one under All Settings → WebSocket channels","err");
      ch={name:"ws_"+t.iface,path:t.path,mode:t.mode,enabled:true};w.channels.push(ch);
    }else ch.enabled=true;
    let br=b.bridges.find(x=>(x.a===t.iface&&x.b===ch.name)||(x.b===t.iface&&x.a===ch.name));
    let parked=null;
    if(!br){
      /* single-consumer rule: an interface carries ONE enabled bridge */
      const other=b.bridges.find(x=>x.enabled!==false&&(x.a===t.iface||x.b===t.iface));
      if(other){other.enabled=false;parked=other.name;}
      if(b.bridges.length>=6)return toast("No free connection slot: remove one under Settings → Connections","err");
      b.bridges.push({name:t.bridge,a:t.iface,b:ch.name,translator:"raw",enabled:true});
    }else br.enabled=true;
    store.stage("websocket_manager",w);store.stage("bridge_manager",b);
    wm=w;bm=b;stagedHere=true;paintReady();
    toast(t.label+" staged"+(parked?" (connection "+parked+" paused: one per interface)":"")+": press Submit Changes to apply","ok");
  }
  function paintReady(){
    const t=TERM[typeSel.value];const st=bridgeState(t);
    readyEl.replaceChildren();
    if(!st||ws){connBtn.disabled=false;return;}
    if(stagedHere||(st.ready&&!ws&&connBtn.dataset.refused===t.path)){
      connBtn.disabled=true;
      readyEl.append(banner("info","alert",h("b",{},t.label+" is configured but not active yet. "),
        "Press ",h("b",{},"Submit Changes")," in the header (or ",h("b",{},"reboot to apply")," in the side menu if it says Restart pending). The device restarts; then come back and Connect."));
      return;
    }
    if(st.ready){connBtn.disabled=false;return;}
    connBtn.disabled=true;
    readyEl.append(banner("warn","alert",h("b",{},"The "+t.label+" is not wired to the web terminal. "),
      "It needs a ",h("b",{},t.row)," connection on ",h("code",{},t.path),". ",
      h("button",{class:"btn sm pri",style:"margin:0 8px",onclick:()=>stageBridge(t)},"Enable "+t.label),
      h("span",{class:"help"},"or set it up under Settings → Connections; it applies with Submit (device restarts).")));
  }
  await loadBridges();
  typeSel.onchange=()=>{title.textContent=(typeSel.value==="elm327"?"elm327: ":"wican-console: ")+TERM[typeSel.value].path;paintReady();};
  paintReady();
  function setConnState(on){
    badge.className="chip "+(on?"ok":"crit");badge.replaceChildren(h("span",{class:"d"}),on?"Connected":"Disconnected");
    connBtn.className="btn "+(on?"danger":"pri");connBtn.textContent=on?"Disconnect":"Connect";
    typeSel.disabled=on;input.disabled=!on;sendBtn.disabled=!on;
    input.placeholder=on?(typeSel.value==="elm327"?"e.g. ATZ, 0100, 010C":"e.g. help, status, version"):"Connect to start";
    if(on)setTimeout(()=>input.focus(),40);
  }
  function connect(){
    const elm=typeSel.value==="elm327";
    const path=elm?"/ws/obd":"/ws/cli";
    title.textContent=(elm?"elm327: ":"wican-console: ")+path;
    prompt.textContent=elm?">":"wican>";
    const url=(API?API.replace(/^http/,"ws"):location.origin.replace(/^http/,"ws"))+path;
    try{ws=new WebSocket(url);}catch{put("cannot open "+url+"\n");return;}
    ws.binaryType="arraybuffer";
    let opened=false;
    ws.onopen=()=>{opened=true;delete connBtn.dataset.refused;setConnState(true);put("[connected "+path+"]\n");};
    ws.onclose=()=>{if(ws){
      if(opened)put("\n[disconnected]\n");
      else{ /* refused = no bridge on this path (or a staged one not applied yet) */
        put("\n[could not connect to "+path+": "+(elm?"no OBD chip ⇄ WebSocket connection on /ws/obd":"the console is not bridged to /ws/cli")+". Set it up under Settings → Connections (or use the button above) and Submit; a change that is still pending needs the restart first.]\n");
        connBtn.dataset.refused=path;loadBridges().then(paintReady);}
      setConnState(false);ws=null;}};
    ws.onmessage=e=>put((typeof e.data==="string"?e.data:dec.decode(e.data)).replace(/\r/g,"\n").replace(/\n+/g,"\n"));
  }
  connBtn.onclick=()=>{if(ws){const w=ws;ws=null;w.close();setConnState(false);}else connect();};
  function send(){
    if(!ws||ws.readyState!==1)return;
    const v=input.value;if(!v.trim())return;
    put((typeSel.value==="elm327"?"":"wican> ")+v+"\n");
    /* NEWLINE REQUIRED: a bare send poisons the console's line buffer */
    ws.send(v+(typeSel.value==="elm327"?"\r":"\r\n"));
    hist.push(v);hi=hist.length;input.value="";
  }
  sendBtn.onclick=send;
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();send();}
    else if(e.key==="ArrowUp"){if(hi>0){hi--;input.value=hist[hi]||"";e.preventDefault();}}
    else if(e.key==="ArrowDown"){if(hi<hist.length){hi++;input.value=hist[hi]||"";}}});
  return()=>{if(ws){const w=ws;ws=null;w.close();}};
};

      ["Heading",(g.heading??0).toFixed(0)+"°"],["Altitude",(g.altitude??0).toFixed(0)+" m"],["Accuracy",g.accuracy?"±"+g.accuracy+" m":"-"],["Age",(g.age_ms/1000).toFixed(1)+" s"]);

/* ---- Certificates (cert_manager sets; key material is write-only) ---- */
async function certsCard(){
  const listEl=h("div",{});
  const refresh=async()=>{
    try{const r=await api("/api/certs");
      listEl.replaceChildren(dataTable([
        {label:"Name",get:s=>h("b",{class:"mono",style:"font-weight:600"},s.name)},
        {label:"CA",get:s=>s.ca?chip("yes","ok"):h("span",{class:"help"},"-")},
        {label:"Client Cert",get:s=>s.cert?chip("yes","ok"):h("span",{class:"help"},"-")},
        {label:"Client Key",get:s=>s.key?chip("yes","ok"):h("span",{class:"help"},"-")},
        {label:"",align:"right",get:s=>h("button",{class:"btn sm gh danger",onclick:async()=>{
          if(!await confirmModal("Delete certificate set \""+s.name+"\"? Consumers referencing it fall back to the built-in CA bundle at the next connection.","Delete set"))return;
          try{await api("/api/certs?set="+encodeURIComponent(s.name),{method:"DELETE"});toast("Deleted","ok");refresh();}
          catch(e){toast(e.message,"err");}}},ic("trash"))}
      ],r.sets||[],{empty:"No certificate sets yet: upload one below."}));
    }catch(e){listEl.replaceChildren(banner("crit","alert",e.message));}
  };
  await refresh();
  const name=h("input",{type:"text",maxlength:24,placeholder:"e.g. home_broker",style:"max-width:220px"});
  const files={},resets=[];
  const pickBtn=(type,label)=>{
    const cap=h("span",{},label);
    resets.push(()=>{cap.textContent=label;delete files[type];});
    return h("label",{class:"btn sm"},cap,
      h("input",{type:"file",accept:".pem,.crt,.cer,.key,.txt",style:"display:none",onchange:e=>{
        files[type]=e.target.files[0]||null;
        cap.textContent=files[type]?files[type].name:label;e.target.value="";}}));};
  const upBtn=h("button",{class:"btn pri sm",onclick:async()=>{
    const n=(name.value||"").trim();
    if(!/^[a-z0-9_-]{1,24}$/.test(n))return toast("Set name: 1-24 chars, a-z 0-9 - _","err");
    const parts=["ca","cert","key"].filter(t=>files[t]);
    if(!parts.length)return toast("Choose at least one PEM file","err");
    upBtn.disabled=true;
    try{
      for(const t of parts){ /* raw body: bypasses the api() JSON wrapper */
        const res=await fetch(API+"/api/certs/upload?set="+encodeURIComponent(n)+"&type="+t,
          {method:"POST",body:await files[t].text()});
        if(!res.ok){let m="HTTP "+res.status;try{m=(await res.json()).error||m;}catch{}
          throw new Error(t+": "+m);}
      }
      toast("Uploaded "+parts.length+" part"+(parts.length>1?"s":"")+" to \""+n+"\"","ok");
      name.value="";resets.forEach(f=>f());refresh();
    }catch(e){toast("Upload failed: "+e.message,"err");}
    upBtn.disabled=false;}},ic("upload"),"Upload");
  return card("Certificates","shield",listEl,
    h("div",{style:"border-top:1px solid var(--border);margin:14px 0 12px"}),
    h("div",{class:"frow"},h("label",{},"Set name"),h("div",{class:"ctl"},name),
      h("div",{class:"help"},"A new name creates a set; an existing name replaces the uploaded parts.")),
    h("div",{class:"frow"},h("label",{},"PEM files"),h("div",{class:"ctl"},
      h("div",{class:"rowflex",style:"flex-wrap:wrap;gap:8px"},
        pickBtn("ca","CA certificate…"),pickBtn("cert","Client certificate…"),pickBtn("key","Client key…"),upBtn)),
      h("div",{class:"help"},"Any subset per upload, 8 KB max per part. A set needs at least a CA to verify servers; add BOTH client certificate and key for mutual TLS.")),
    note("","Up to 10 named sets, stored under /data/certs. Key material can never be read back through this page or the API. MQTT, Home Assistant and HTTPS data destinations select a set via their “Cert Set” option; changes take effect on the next connection (reboot to be sure)."));

/* ISO 14229 requests to one ECU: the live path (native CAN ISO-TP or the OBD

   present session (POST /api/uds/session), and a TERMINAL of every request
   (›) and reply (‹) with the decode inline, kept across page visits (last
   300 lines), a sent line clicks back into the form, plus the component's
   settings card. */

  const p=page(view,null,"UDS Tool","Send ISO 14229 requests to an ECU");

    const idleS=Math.round((st.exclusive_idle_ms||10000)/1000);
    statusEl.replaceChildren(section("Path & bus",null,
      h("div",{class:"rowflex",style:"gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center"},
        native?chip("over native CAN","ok"):chip(st.can_running?"over the OBD chip":"over the OBD chip, native CAN is off",st.can_running?"":"warn"),
        chip("transport: "+(st.backend_setting||"auto"),""),chip("provider: "+provider,""),
        st.session_active?chip("session open (tester present)","info"):null,
        st.autopid_paused?chip("AutoPID paused","warn"):null),
      h("div",{class:"rowflex",style:"gap:12px;flex-wrap:wrap;align-items:center"},
        switchCtl(!!st.exclusive,v=>{api("/api/uds",{method:"POST",body:{exclusive:v}}).then(()=>status()).catch(e=>toast(e.message,"err"));},{yes:"Exclusive bus: on",no:"Exclusive bus: off",title:"While the tool is in use, AutoPID polling and DTC scans stay off the bus"}),
        h("span",{class:"help"},st.exclusive?"AutoPID stays off the bus from a request until "+idleS+" s of idle, or while a session is open.":"AutoPID keeps polling between requests. Turn on for a bus to yourself; the boot default is in the settings below.")),
      !native?banner("info","info","The OBD chip path shares the chip with AutoPID and takes single-frame requests only. Enable the CAN bus (CAN bus settings) for native ISO-TP: multi-frame, faster, independent of AutoPID."):null));}
  await status();
  /* request */
  const tx=h("input",{class:"mono",value:"7E0",title:"Request CAN ID (hex)"}),rx=h("input",{class:"mono",value:"7E8",title:"Response CAN ID (hex)"}),
    ext=h("input",{type:"checkbox",title:"29-bit extended CAN IDs"}),
    data=h("input",{class:"mono",value:"22 F1 90",placeholder:"hex bytes, e.g. 22 F1 90"}),
    to=h("input",{type:"number",value:"5000",min:500,max:30000,step:100,title:"P2*: how long to wait for the final response after the ECU answers 'response pending' (0x78)"});

      const r=await api("/api/uds/session",{method:"POST",body});if(r&&r.ok===false){toast(r.error||"session refused","err");sessionSw.load(false);}await status();}
    catch(e){toast(e.message,"err");sessionSw.load(false);}},{yes:"Session open",no:"No session",title:"Tester present keeps the ECU in its session between your requests (security access, programming)"});
  /* the terminal: every request and reply of this browser, newest at the

  const term=h("div",{class:"console",style:"height:52vh;min-height:280px"});
  const hhmmss=(t)=>{const d=new Date(t);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");};

    if(verbose)term.append(h("pre",{class:"dim",style:"margin:0 0 4px 30px;white-space:pre-wrap;font-size:11px"},JSON.stringify(r)));
  }
  function renderTerm(){term.replaceChildren();
    if(!termLog.length)term.append(h("div",{class:"dim"},"No requests yet. Every request (›) and reply (‹) lands here; scroll up for older ones, click a sent line to load it back into the form."));
    termLog.forEach(renderEntry);term.scrollTop=term.scrollHeight;}
  const send=async(bytes)=>{const req=(bytes||data.value).trim();if(!req)return;
    const body={tx_id:tx.value.trim(),rx_id:rx.value.trim(),ext:ext.checked,data:req,p2star_ms:Number(to.value)||5000};
    const e={t:Date.now(),tx:body.tx_id,rx:body.rx_id,ext:body.ext,req,r:null,err:null};
    termLog.push(e);if(termLog.length>TERM_MAX)termLog=termLog.slice(-TERM_MAX);renderTerm();
    try{e.r=await api("/api/uds/request",{method:"POST",body});}catch(err){e.err=err.message;}
    saveTerm(termLog);renderTerm();status();};
  const verboseBtn=h("button",{class:"btn sm gh",type:"button",onclick:()=>{verbose=!verbose;verboseBtn.replaceChildren(verbose?"Hide raw JSON":"Raw JSON");renderTerm();}},"Raw JSON");
  const clearBtn=h("button",{class:"btn sm gh",type:"button",title:"Forget the terminal's lines (this browser only)",onclick:()=>{termLog=[];saveTerm(termLog);renderTerm();}},"Clear");
  const quick=(lbl,bytes)=>h("button",{class:"btn sm",onclick:()=>{data.value=bytes;send(bytes);}},lbl);
  p.append(statusEl,section("Request",null,
    h("div",{class:"frow"},h("label",{},"Tx / Rx ID"),h("div",{class:"ctl rowflex",style:"gap:8px;align-items:center"},tx,h("span",{class:"dim"},"→"),rx,h("label",{class:"help",style:"display:flex;gap:4px;align-items:center;white-space:nowrap"},ext,"29-bit"))),
    h("div",{class:"frow"},h("label",{},"Request bytes"),h("div",{class:"ctl"},data)),
    h("div",{class:"frow"},h("label",{},"Final response timeout (P2*)"),h("div",{class:"ctl rowflex",style:"gap:8px;align-items:center;flex-wrap:wrap"},h("div",{style:"max-width:120px"},to),h("span",{class:"help"},"ms"),h("span",{class:"grow"}),sessionSw,h("button",{class:"btn pri",onclick:()=>send()},ic("play"),"Send"))),
    h("div",{class:"rowflex",style:"gap:8px;margin-top:6px;flex-wrap:wrap"},h("span",{class:"help"},"Quick:"),quick("Session 10 02","10 02"),quick("Read VIN 22 F1 90","22 F1 90"),quick("Tester present 3E 00","3E 00"),quick("Read DTCs 19 02 09","19 02 09"))),
    sectionTools("Terminal",[verboseBtn,clearBtn],term));
  renderTerm();
  data.addEventListener("keydown",ev=>{if(ev.key==="Enter")send();});
  /* the settings card: transport, timing, the exclusive boot default */
  const formEl=h("div",{});p.append(formEl);
  try{const rows=await settingsForm("uds_manager");formEl.replaceChildren(sectionTools("UDS settings",[],...rows));}catch(e){formEl.replaceChildren(banner("crit","alert",e.message));}
  const t=setInterval(()=>{if(conn.state==="online")status();},4000);
  return()=>{clearInterval(t);const inp=sessionSw.querySelector("input");if(inp&&inp.checked)api("/api/uds/session",{method:"POST",body:{action:"end"}}).catch(()=>{});};
};

/* ---- Logs ---- */
PAGES.logs=async(view)=>{
  const p=page(view,null,"Logs","Device log ring and sinks");
  const tag=h("input",{value:"*",style:"width:150px",placeholder:"tag or *",title:"Log tag (component), * = all"});
  const lvl=h("select",{style:"width:160px"},...[["error","Errors only"],["warn","Warnings"],["info","Info"],["debug","Debug"],["verbose","Verbose"]].map(([v,l])=>h("option",{value:v,selected:v==="info"},l)));
  const auto=h("input",{type:"checkbox",checked:true});const sinks=h("div",{class:"rowflex",style:"gap:8px;flex-wrap:wrap"});
  const out=h("div",{class:"console"});
  p.append(section("Controls",null,
    h("div",{class:"rowflex",style:"gap:10px;flex-wrap:wrap"},
      h("span",{class:"help"},"Level for"),tag,lvl,
      h("button",{class:"btn sm",title:"Change the runtime log level for this tag (not persisted)",onclick:async()=>{try{await api("/api/logs/level",{method:"PUT",body:{tag:tag.value||"*",level:lvl.value}});toast("Level set","ok");}catch(e){toast(e.message,"err");}}},"Set level"),
      h("span",{class:"grow"}),h("label",{class:"rowflex",style:"gap:6px;font-size:12px;color:var(--text-2)"},auto,"auto-scroll"),
      h("a",{class:"btn sm gh",href:API+"/api/logs/ring",download:"wican-log.txt",title:"Download the log ring as a text file"},ic("down"),"Download"),
      h("button",{class:"btn sm gh danger",title:"Empty the log ring",onclick:async()=>{try{await api("/api/logs/ring",{method:"DELETE"});out.replaceChildren();toast("Cleared","ok");}catch(e){toast(e.message,"err");}}},ic("trash"),"Clear")),
    h("div",{style:"margin-top:10px"},sinks)),out);
  const ANSI=/\x1b\[[0-9;]*m/g;
  /* classify by the IDF level letter first ("E (123) tag:"); the free-text
     fallback only applies to lines without one (boot banners, panics) */
  const cls=l=>{const m=/^\s*([EWIDV]) \(\d+\)/.exec(l);
    if(m)return m[1]==="E"?"er":m[1]==="W"?"wn":(m[1]==="D"||m[1]==="V")?"dim":"";
    return/abort\(\)|panic|Guru Meditation|assert failed/i.test(l)?"er":/---- boot|rst:|ESP-ROM/i.test(l)?"dim":"";};
  async function ring(){try{const txt=await api("/api/logs/ring");out.replaceChildren(...String(txt).replace(ANSI,"").split("\n").map(l=>h("div",{class:cls(l)},l)));if(auto.checked)out.scrollTop=out.scrollHeight;}catch{}}
  async function sink(){const s2=await tryGet("/api/logs/status");if(!s2)return;sinks.replaceChildren(h("span",{class:"help"},"Dropped "+s2.dropped+" · click a sink to toggle it:"),...(s2.sinks||[]).map(k=>h("button",{class:"chip "+(k.enabled?"ok":""),style:"cursor:pointer;border:none",title:(k.enabled?"Disable":"Enable")+" the "+k.name+" log sink",onclick:async()=>{try{await api("/api/logs/sink",{method:"PUT",body:{name:k.name,enabled:!k.enabled}});sink();}catch(e){toast(e.message,"err");}}},h("span",{class:"d"}),k.name)));}
  await sink();await ring();const t=setInterval(()=>{if(conn.state==="online")ring();},2500);return()=>clearInterval(t);
};

/* ---- System Monitor (tasks / CPU / heap / temperature) ---- */
PAGES.sysmon=async(view)=>{
  const p=page(view,null,"System Monitor","Live tasks, CPU load, heap and die temperature");
  p.classList.add("wide");
  const tilesEl=h("div",{class:"tiles"});
  const faultsEl=h("div",{});
  const heapEl=h("div",{class:"cols2"});
  const taskEl=h("div",{});
  p.append(tilesEl,faultsEl,heapEl,taskEl);
  let prev=null;
  async function refresh(){
    const[st,tk,fl]=await Promise.all([tryGet("/api/status"),tryGet("/api/status/tasks"),tryGet("/api/faults")]);
    if(!st||!tk||!tk.tasks)return;
    /* device fault codes (the automotive-DTC idea for the firmware):
       latched in NVS until MANUALLY cleared: a fault that fired once in
       the field stays visible here */
    const faults=(fl&&fl.faults)||[];
    const ftime=t=>t>0?new Date(t*1000).toLocaleString():"-";
    faultsEl.replaceChildren(section("Fault codes",
      "structural problems latch here and survive reboots until cleared, like DTCs in a car",
      ...(faults.length===0?[h("div",{class:"help"},"No fault codes, device healthy.")]:[
        dataTable([
          {label:"Code",get:r=>chip(r.code,"crit"),mono:true},
          {label:"Detail",key:"detail"},
          {label:"Count",key:"count",align:"right",mono:true},
          {label:"First seen",get:r=>ftime(r.first_time),mono:true},
          {label:"Last seen",get:r=>ftime(r.last_time),mono:true},
        ],faults),
        h("div",{style:"margin-top:10px"},h("button",{class:"btn",onclick:async()=>{
          if(!await confirmModal(faults.length+" latched fault code(s) will be erased from NVS. Investigate before clearing: this is the only record.","Clear faults"))return;
          try{await api("/api/faults/clear",{method:"POST"});toast("Fault codes cleared","ok");refresh();}
          catch(e){toast("Clear failed","err");}
        }},"Clear fault codes"))])));
    const map=new Map(tk.tasks.map(x=>[x.name,x.runtime_us]));
    let rows=tk.tasks.map(x=>({...x,cpu:null}));
    let busy=null;
    if(prev&&tk.total_us>prev.total_us){
      const win=(tk.total_us-prev.total_us)*(tk.cores||2);
      let idle=0;
      rows=tk.tasks.map(x=>{const p0=prev.map.get(x.name);
        const d=p0!=null?Math.max(0,x.runtime_us-p0):0;
        if(/^IDLE/.test(x.name))idle+=d;
        return{...x,cpu:win>0?d/win*100:0};});
      busy=win>0?Math.max(0,100-idle/win*100):null;
    }
    prev={total_us:tk.total_us,map};
    rows.sort((a,b)=>((b.cpu??0)-(a.cpu??0))||(a.stack_hw-b.stack_hw));
    const m=st.memory;
    tilesEl.replaceChildren(
      tile("CPU load",busy==null?"…":busy.toFixed(1),"%",{kind:busy>85?"crit":busy>60?"warn":""}),
      tile("Tasks",rows.length,null),
      tile("Internal free",m?fmt.bytes(m.internal.free):"-",null,{cap:m?"min ever "+fmt.bytes(m.internal.min_free):null,kind:m&&m.internal.free<20480?"crit":m&&m.internal.free<40960?"warn":""}),
      tile("Die temp",st.temp_c!=null?st.temp_c.toFixed(1):"-","°C",{kind:st.temp_c>75?"crit":st.temp_c>60?"warn":""}),
      tile("Log errors",st.health?String(st.health.log_errors):"-",null,{cap:st.health?st.health.log_warnings+" warnings":null,kind:st.health&&st.health.log_errors>0?"crit":""}),
      tile("Flash erases",st.health&&st.health.flash?String(st.health.flash.erases):"-",null,{cap:"since boot",kind:""}));
    if(m)heapEl.replaceChildren(...[["Internal RAM","the scarce heap: radio stacks live here",m.internal],["PSRAM","bulk heap",m.psram]].map(([label,desc,hp])=>
      section(label,desc,
        meter(hp.total-hp.free,hp.total),
        kv([["In use",fmt.bytes(hp.total-hp.free)+" of "+fmt.bytes(hp.total)],["Free now",fmt.bytes(hp.free)],["Lowest ever",fmt.bytes(hp.min_free)],
          /* the PSRAM heap's largest block is not in the polled status (measuring it stops interrupts for milliseconds) */
          ...(hp.largest_block!=null?[["Largest free block",fmt.bytes(hp.largest_block)]]:[])]))));
    const STATE={X:["running","ok"],R:["ready","ok"],B:["blocked",""],S:["suspended","warn"],D:["deleted","crit"]};
    taskEl.replaceChildren(section("Tasks","stack headroom = bytes NEVER used (small = near overflow); CPU % measured between refreshes",
      dataTable([
        {label:"Task",key:"name",mono:true},
        {label:"State",get:r=>{const s2=STATE[r.state]||[r.state,""];return chip(s2[0],s2[1]);}},
        {label:"Core",get:r=>r.core<0?"any":String(r.core),align:"right"},
        {label:"Prio",key:"prio",align:"right"},
        {label:"Stack headroom",get:r=>r.stack_hw<512?chip(fmt.bytes(r.stack_hw),r.stack_hw<256?"crit":"warn"):fmt.bytes(r.stack_hw),align:"right",mono:true},
        {label:"CPU %",get:r=>r.cpu==null?"…":(r.cpu>0&&r.cpu<0.05?"<0.1":r.cpu.toFixed(1)),align:"right",mono:true},
      ],rows)));
  }
  await refresh();const t=setInterval(()=>{if(conn.state==="online")refresh();},2000);return()=>clearInterval(t);
};

/* Socket servers (All Settings): the connection each server carries; a
   server switched on with nothing bridged accepts clients and sends them
   nothing (2026-10-16), so it gets a warning and a shortcut that opens the
   Connections card with the CAN bus row ready. Repainted on every edit of
   the form (settingsForm's onDirty). */
async function socketServersFoot(vals){
  const el=h("div",{style:"margin-top:10px;display:flex;flex-direction:column;gap:6px"});
  const bm=await tryGet("/api/settings/bridge_manager");
  el.paint=()=>{const bridges=((store.pending.get("bridge_manager")||bm||{}).bridges)||[];
    el.replaceChildren(...(vals.servers||[]).map(s=>{
      const br=bridges.find(b=>b.enabled!==false&&(b.a===s.name||b.b===s.name));
      if(br)return h("div",{class:"help","data-server":s.name},brWhere(s)+": carries connection "+br.name+".");
      if(!s.enabled)return h("div",{class:"help","data-server":s.name},brWhere(s)+": switched off.");
      return banner("warn","alert",h("b",{},brWhere(s)+" is switched on but no connection uses it. "),"A client can connect to it and gets nothing. ",
        h("button",{class:"btn sm","data-orphan":s.name,type:"button",style:"margin-left:6px",onclick:()=>brOpenForServer(s)},ic("plus"),"Add a CAN bus connection on "+String(s.proto||"tcp").toUpperCase()+" "+s.port));
    }));};
  el.paint();return el;
}
